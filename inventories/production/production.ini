[localhost]
localhost ansible_connection=local

[service]
service.internal.levantine.io

[BastionHosts]
# ansible_ssh_private_key_file is spelled out here because this is the one
# host in the fleet whose name does not end in .internal.levantine.io, and
# `service`'s hand-written ~/.ssh/config only maps the automation key onto
# that pattern. Every other host therefore picks the key up implicitly and
# this one did not, so a plain `ansible-playbook ...` run reports it
# `unreachable` ("Permission denied (publickey)") and still exits 0 -- one
# unreachable host out of several is not a failed run.
#
# The scheduled work was never affected: /usr/local/bin/renew_levantine_ssl.sh
# passes --user and --private-key on the command line, so the weekly
# levantine-ssl-renew job has been reaching this host all along (journal
# confirms Result=success). What this fixes is the ad-hoc case -- running
# deploySSLCerts.yml or any other play by hand quietly skipped the one host
# that terminates TLS for every public URL, and said so only in a PLAY
# RECAP line that is easy to read past.
#
# Declared in the inventory rather than in ~/.ssh/config on purpose: the
# inventory is committed and reviewable, whereas that ssh config is
# hand-made, gitignored and unmanaged (see the README's note on `service`
# being bootstrapped by hand). It also means the renewal script's --user /
# --private-key flags are now belt-and-braces rather than load-bearing.
bastion.prod.levantine.io ansible_user=automation ansible_ssh_private_key_file=~/.ssh/automation.pem
vmwarebastion.internal.levantine.io

[Wireguard]
bastion.prod.levantine.io wg=server
vmwarebastion.internal.levantine.io wg=client
service.internal.levantine.io wg=client

[Nginx]
bastion.prod.levantine.io rp_flow=upstream
vmwarebastion.internal.levantine.io rp_flow=downstream

[VMWareDockerHosts]
dockerhost1.internal.levantine.io

[Theia]
theia.internal.levantine.io

[Vault]
vault.internal.levantine.io

[PerconaCluster]
# !!! WARNING !!! Only ONE node should have bootstrap=True or you may end up with a split-brain cluster which can result in data loss!
# NOTE: the wsrep_node_name will be based on the inventory_hostname
pxdbc1.internal.levantine.io bootstrap=yes
pxdbc2.internal.levantine.io bootstrap=no
pxdbc3.internal.levantine.io bootstrap=no

[ProxySQL]
proxysql.internal.levantine.io

[DataGatewayK8Cluster]
# Only one control node should be initialized with init_node=yes
kube-c-00.internal.levantine.io node=controller init_node=yes
# kube-c-01.internal.levantine.io node=controller init_node=no
# Scaled down to single-node for the portfolio demo (2026-08-17) -- see the
# matching comment in terraform/proxmox/vms.tf. kube-c-00 runs the demo
# workload itself now (control-plane taint removed in
# configure_control_plane.yml). Uncomment these two lines along with the
# terraform entries to restore the full 3-node demo state.
# kube-w-00.internal.levantine.io node=worker
# kube-w-01.internal.levantine.io node=worker

[PiHole]
pi-hole.internal.levantine.io

[Frigate]
# ansible_host pins the SSH connection to the address rather than the name,
# the same reasoning ProxmoxHosts below documents: it removes a DNS
# dependency from the connection itself. The name stays authoritative for
# everything else (monitoring targets, livecam's backend URLs), and is an
# OPNsense Unbound host override like every other internal name.
frigate.internal.levantine.io ansible_host=192.168.1.86

[ProxmoxHosts]
# Bare-metal hypervisor hosts, not cloud-init guest VMs -- monitoring
# coverage only (roles/os_configs/monitoring_agents.yml), never targeted by
# all.yml's broader baseline or by rebuild-fleet.sh. Raw IPs, not
# hostnames, simply to avoid any DNS dependency for the SSH connection
# itself (both hosts do have real DNS records now -- 3800xt/fx8200.
# internal.levantine.io via OPNsense Unbound Host Overrides).
10.69.69.139
10.69.69.116