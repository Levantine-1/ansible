# https://kubernetes.io/docs/setup/production-environment/#what-s-next
# https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/
# https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/
---
  # Required kubeadm prerequisite (https://kubernetes.io/docs/setup/production-environment/container-runtimes/#prerequisites)
  # that was missing here -- found the hard way after a host reboot: without
  # br_netfilter loaded, kube-proxy's iptables Service NAT works for the
  # forward leg but same-node ClusterIP traffic (e.g. pod -> kube-dns
  # Service -> CoreDNS pod on the same node) silently drops the return leg,
  # since bridged traffic bypasses netfilter without bridge-nf-call-iptables.
  - name: Load br_netfilter kernel module persistently
    copy:
      content: "br_netfilter\n"
      dest: /etc/modules-load.d/k8s.conf
    register: br_netfilter_module

  - name: Load br_netfilter kernel module now
    community.general.modprobe:
      name: br_netfilter
      state: present

  - name: Set bridge/forwarding sysctls persistently
    copy:
      content: |
        net.bridge.bridge-nf-call-iptables = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward = 1
      dest: /etc/sysctl.d/k8s.conf
    register: k8s_sysctl

  - name: Apply sysctl settings now
    ansible.builtin.command: sysctl --system
    when: k8s_sysctl.changed or br_netfilter_module.changed

  - name: Disable system swap
    shell: "swapoff -a"

  - name: Remove current swaps from fstab
    lineinfile:
      dest: /etc/fstab
      regexp: '(?i)^([^#][\S]+\s+(none|swap)\s+swap.*)'
      line: '# \1'
      backrefs: yes
      state: present

  - name: Install Required Packages
    package:
      name: "{{ required_packages }}"
      state: present

  - name: Download cri-dockerd binary
    get_url:
      url: "https://github.com/Mirantis/cri-dockerd/releases/download/v0.3.14/cri-dockerd_0.3.14.3-0.debian-bookworm_amd64.deb"
      dest: "/tmp/cri-dockerd_0.3.14.3-0.debian-bookworm_amd64.deb"

# Regarding cri-dockerd:
# Note:  https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/
# Docker Engine does not implement the CRI which is a requirement for a container runtime to work with Kubernetes.
# For that reason, an additional service cri-dockerd has to be installed.
# cri-dockerd is a project based on the legacy built-in Docker Engine support that was removed from the kubelet in
# version 1.24.
# Runtime/ Domain socket: Docker Engine (using cri-dockerd)	unix:///var/run/cri-dockerd.sock

  - name: Install cri-dockerd
    apt:
      deb: "/tmp/cri-dockerd_0.3.14.3-0.debian-bookworm_amd64.deb"

  - name: Enable and start cri-dockerd service
    ansible.builtin.systemd:
      name: cri-docker
      enabled: yes
      state: started

  - name: Add Kubernetes APT GPG key
    ansible.builtin.apt_key:
      url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
      state: present
      keyring: /usr/share/keyrings/kubernetes-archive-keyring.gpg

  - name: Add Kubernetes APT repository
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
      state: present
      filename: 'kubernetes'
    register: apt_repo

  - name: Update apt cache
    ansible.builtin.apt:
      update_cache: yes
    when: apt_repo.changed
    ignore_errors: yes

  - name: Install Kubernetes Packages
    package:
      name: "{{ kube_packages }}"
      state: present

  - name: Set Kubernetes Packages Apt Hold State
    ansible.builtin.apt:
      name: "{{ kube_packages }}"
      state: "{{ DataGatewayK8Cluster.apt_package_hold_state | default('held') }}"

  - name: Enable and start kubelet service
    ansible.builtin.systemd:
      name: kubelet
      enabled: yes
      state: started

  # NOTE: 2024-07-17: I'm giving up on getting self-signed certs working for the local registry for now. See configure control plane playbook for more info.
  - name: Add insecure-registries and registry-mirrors to daemon.json
    copy:
      content: |
        {
          "insecure-registries" : ["{{ DataGatewayK8Cluster.control_plane_endpoint }}:5000"],
          "registry-mirrors" : ["http://{{ apt_cache_mirror.host }}:{{ apt_cache_mirror.registry_port }}"]
        }
      dest: /etc/docker/daemon.json
    register: daemon_json

  - name: Restart Docker
    systemd:
      name: docker
      state: restarted
    when: daemon_json.changed