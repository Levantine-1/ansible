---
# Playbook Courtesy of DigitalOcean
# https://www.digitalocean.com/community/tutorials/how-to-use-ansible-to-install-and-set-up-docker-on-ubuntu-20-04

- name: Install Docker
  hosts: VMWareDockerHosts:service:DataGatewayK8Cluster
  become: true

  tasks:
    - name: Install aptitude
      apt:
        name: aptitude
        state: latest
        update_cache: true

    - name: Install required system packages
      apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
        state: latest
        update_cache: true

    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Update apt and install docker-ce
      apt:
        name: docker-ce
        state: latest
        update_cache: true

    - name: Install docker python package
      package:
        name: "python3-docker"
        state: present

    - name: Add insecure-registries and registry-mirrors to daemon.json
      # insecure-registries: needed so dockerhost1 can `docker pull` from
      # service's local registry (used by
      # downloadDockerImage.yml/deployDockerImage.yml to move images
      # between hosts, replacing the old base64-over-SSH fetch mechanism
      # that failed on large images) without TLS. Scoped to
      # VMWareDockerHosts only -- service itself never needs this (it only
      # ever pushes to its own localhost:5000, which Docker already trusts
      # as insecure by default), and DataGatewayK8Cluster hosts manage
      # their own separate daemon.json for their own local registry in
      # kubernetes_clusters_baseline/setup_k8_baseline.yml -- writing this
      # file unconditionally here would clobber that.
      # registry-mirrors: routes public Docker Hub pulls (registry:latest,
      # jwilder/nginx-proxy) through the pull-through cache on `service`
      # (roles/applications/apt_cache_mirror/) instead of hitting Docker
      # Hub directly on every rebuild.
      copy:
        content: |
          {
            "insecure-registries" : ["service.internal.levantine.io:5000"],
            "registry-mirrors" : ["http://{{ apt_cache_mirror.host }}:{{ apt_cache_mirror.registry_port }}"]
          }
        dest: /etc/docker/daemon.json
      register: daemon_json
      when: "'VMWareDockerHosts' in group_names"

    - name: Add registry-mirrors to daemon.json (service)
      copy:
        content: |
          {
            "registry-mirrors" : ["http://{{ apt_cache_mirror.host }}:{{ apt_cache_mirror.registry_port }}"]
          }
        dest: /etc/docker/daemon.json
      register: daemon_json_service
      when: "'service' in group_names"

    - name: Restart Docker
      systemd:
        name: docker
        state: restarted
      when: daemon_json.changed or daemon_json_service.changed