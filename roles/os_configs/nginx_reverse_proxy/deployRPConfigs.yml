---
- name: Deploy Nginx Reverse Proxy Configuration Files
  hosts: Nginx
  become: yes

  tasks:
    - name: Install Nginx
      package:
        name: nginx
        state: present

    - name: Remove stock default site
      # Not strictly required here since reverse_proxy.j2 doesn't declare
      # default_server itself, but removing Debian's stock default_server
      # site is the same cleanup applied in jenkins/deployReverseProxy.yml
      # (where it *does* conflict) -- keeping both roles consistent so a
      # future from-scratch nginx host doesn't depend on this file having
      # been removed by hand outside of ansible.
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Configure Nginx Reverse Proxies
      template:
        src: "templates/reverse_proxy.j2"
        dest: "/etc/nginx/conf.d/{{ item }}.conf"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ domains }}"

    - name: Configure Theia One Off Reverse Proxy DownStream
      copy:
        src: "downstream/files/theia_reverse_proxy_downstream.conf"
        dest: "/etc/nginx/conf.d/theia_reverse_proxy.conf"
        remote_src: no
      when: rp_flow is defined and rp_flow == "downstream"

    - name: Configure Theia One Off Reverse Proxy UpStream
      copy:
        src: "upstream/files/theia_reverse_proxy_upstream.conf"
        dest: "/etc/nginx/conf.d/theia_reverse_proxy.conf"
        remote_src: no
      when: rp_flow is defined and rp_flow == "upstream"

    - name: Create systemd override directory for nginx.service
      file:
        path: /etc/systemd/system/nginx.service.d
        state: directory
        mode: "0755"

    - name: Give nginx a restart policy via a systemd override
      # Stock Debian nginx.service has Restart=no -- if nginx fails to
      # start (e.g. a transient DNS lookup failure for an upstream host
      # name at boot), it just stays down forever until someone notices.
      # This is exactly what happened to vmwarebastion's nginx: it failed
      # once during the fleet-wide /etc/hosts gap and never recovered on
      # its own, silently taking levantine.io down for hours.
      copy:
        dest: /etc/systemd/system/nginx.service.d/restart-policy.conf
        content: |
          [Service]
          Restart=on-failure
          RestartSec=10
        owner: root
        group: root
        mode: "0644"
      register: nginx_restart_override

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: nginx_restart_override.changed

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted