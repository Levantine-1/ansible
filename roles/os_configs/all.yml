--- # This is a wrapper playbook to run the bootstrap playbooks
# This playbook assumes the following base image:
# Bone stock no GUI Debian 12 with the "automation" user and public key provisioned with sudo nopass access
# And that's about it.
- import_playbook: installBasicPackages.yml
- import_playbook: user_groups.yml
- import_playbook: users.yml
- import_playbook: bash_profile/manage_bash_profile.yml
- import_playbook: configure_apt_sources.yml
# configure_apt_cache_proxy.yml and apt_cache_mirror deliberately run here,
# not down with the other applications -- all.yml's plays run strictly
# sequentially, so importing them this early guarantees the cache on
# `service` is already up before every later apt/docker-heavy play in this
# same run (installDocker.yml, monitoring_agents.yml,
# kubernetes_clusters_baseline) needs it, including service's own.
- import_playbook: configure_apt_cache_proxy.yml
- import_playbook: ../applications/apt_cache_mirror/configure_apt_cache_mirror.yml
- import_playbook: resize_main_diskPartitionWrapper.yml
- import_playbook: configure_time.yml
# - import_playbook: dnsForwardingAndResolution.yml # NOTE: As of 2023-12-14 this is deprecated by OPNSense
- import_playbook: configureHostname.yml
- import_playbook: configureDHCP.yml
- import_playbook: configure_DNS_Resolver.yml
# configureHostFile.yml (the /etc/hosts workaround briefly "un-deprecated"
# on 2026-07-27 because OPNsense had no records for internal.levantine.io)
# is retired as of 2026-08-17: the actual gap is fixed now, via Unbound
# Host Overrides in OPNsense itself (all 15 fleet hosts, confirmed
# resolving via direct DNS query). No host needs a static /etc/hosts
# entry for internal hostname resolution anymore.
# deploySSLCerts.yml must run BEFORE deployRPConfigs.yml: nginx's reverse
# proxy config references /etc/nginx/certs/<domain>/fullchain.pem, and
# nginx fails to restart if that file doesn't exist yet. Only ever worked
# in the old order because existing hosts already had certs on disk from
# a prior run -- broke immediately on vmwarebastion's first true from-
# scratch rebuild (nginx -t: "no such file or directory" on fullchain.pem).
- import_playbook: deploySSLCerts.yml
- import_playbook: nginx_reverse_proxy/deployRPConfigs.yml
- import_playbook: ../applications/theia/install.yml
- import_playbook: theiaOneOff.yml
- import_playbook: installDocker.yml
- import_playbook: monitoring_agents.yml
- import_playbook: configure_gui.yml
- import_playbook: install_firefox.yml
- import_playbook: configure_wireguard_vpn/configure_wireguard_wrapper.yml
- import_playbook: kubernetes_clusters_baseline/setup_kubernetes_wrapper.yml

####### CONFIGURE APPLICATIONS #######
# Only put configure applications after the base OS configuration
- import_playbook: ../applications/hashicorp_vault/configure_hvault_server.yml
- import_playbook: ../applications/nginx-proxyContainers/configure-jwilder-nginx-proxy-container.yml
- import_playbook: ../applications/perconaXtraDbCluster/configure_percona_wrapper.yml
- import_playbook: ../applications/perconaXtraDbCluster/configure_proxysql.yml
- import_playbook: ../applications/pi-hole/configure_pi-hole.yml