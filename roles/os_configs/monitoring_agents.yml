---
# Fleet-wide monitoring agents: node_exporter (host metrics), cAdvisor
# (container/cgroup metrics), and promtail (log shipping to Loki). All
# three run as native binaries + systemd units rather than Docker
# containers, since not every monitored host has Docker installed (see
# installDocker.yml's much narrower host scope) -- this keeps one
# consistent host group here that matches group_vars/all's monitored_hosts
# exactly, which is what roles/applications/monitoring/templates/
# prometheus.yml.j2 already scrapes.
- name: Deploy node_exporter (host metrics agent)
  hosts: BastionHosts:!bastion.prod.levantine.io:Theia:VMWareDockerHosts:Vault:service:PerconaCluster:ProxySQL:DataGatewayK8Cluster:ProxmoxHosts:Frigate:IncidentAgent
  become: yes

  vars:
    node_exporter_version: "1.8.2"

  tasks:
    - name: Check if node_exporter binary is already installed
      stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_bin

    - name: Create node_exporter system user
      user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        create_home: no

    - name: Download node_exporter tarball
      # curl, not unarchive's remote_src HTTP fetch -- ansible-core 2.14's
      # bundled module_utils/urls.py passes cert_file/key_file to
      # http.client.HTTPSConnection, which Python 3.12+ removed entirely.
      # Bit everyone on Proxmox 9 (Trixie, Python 3.13) hosts. curl sidesteps
      # ansible's HTTP-fetch code path altogether, regardless of target
      # Python version.
      command: curl -sL -o /tmp/node_exporter.tar.gz "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
      when: not node_exporter_bin.stat.exists

    - name: Extract node_exporter tarball
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes
      when: not node_exporter_bin.stat.exists

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: yes
      when: not node_exporter_bin.stat.exists

    - name: Clean up extracted archive
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
        - /tmp/node_exporter.tar.gz
      when: not node_exporter_bin.stat.exists

    - name: Deploy node_exporter systemd unit
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: node_exporter_unit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: node_exporter_unit.changed

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: started

- name: Deploy cAdvisor (container/cgroup metrics agent)
  hosts: BastionHosts:!bastion.prod.levantine.io:Theia:VMWareDockerHosts:Vault:service:PerconaCluster:ProxySQL:DataGatewayK8Cluster:ProxmoxHosts:Frigate:IncidentAgent
  become: yes

  vars:
    cadvisor_version: "0.49.1"

  tasks:
    - name: Check if cAdvisor binary is already installed
      stat:
        path: /usr/local/bin/cadvisor
      register: cadvisor_bin

    - name: Download cAdvisor binary
      # cAdvisor publishes a standalone binary (not just a container image),
      # which is what lets this run on hosts without Docker installed --
      # it just reports host/cgroup metrics and skips container-specific
      # ones on those hosts. On hosts that do have Docker, it auto-detects
      # /var/run/docker.sock and reports full container metrics too.
      # curl, not get_url -- see the node_exporter download task above for
      # why (ansible-core 2.14 / Python 3.12+ HTTPSConnection incompatibility).
      command: curl -sL -o /usr/local/bin/cadvisor "https://github.com/google/cadvisor/releases/download/v{{ cadvisor_version }}/cadvisor-v{{ cadvisor_version }}-linux-amd64"
      when: not cadvisor_bin.stat.exists

    - name: Set cAdvisor binary permissions
      file:
        path: /usr/local/bin/cadvisor
        owner: root
        group: root
        mode: "0755"
      when: not cadvisor_bin.stat.exists

    - name: Deploy cAdvisor systemd unit
      # Port 8081, not cAdvisor's default 8080 -- Jenkins' own web UI already
      # binds 8080 on the jenkins host, which silently left cadvisor down
      # there on the first fleet rollout. Kept consistent across every host
      # (rather than special-casing Jenkins) to match a single scrape port
      # in prometheus.yml.j2.
      copy:
        dest: /etc/systemd/system/cadvisor.service
        content: |
          [Unit]
          Description=cAdvisor
          After=network.target

          [Service]
          User=root
          ExecStart=/usr/local/bin/cadvisor -port=8081 -docker_only=false
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: cadvisor_unit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: cadvisor_unit.changed

    - name: Enable and start cAdvisor
      systemd:
        name: cadvisor
        enabled: yes
        state: started

    - name: Restart cAdvisor if unit changed
      systemd:
        name: cadvisor
        state: restarted
      when: cadvisor_unit.changed

- name: Deploy promtail (log shipping agent to Loki)
  hosts: BastionHosts:!bastion.prod.levantine.io:Theia:VMWareDockerHosts:Vault:service:PerconaCluster:ProxySQL:DataGatewayK8Cluster:ProxmoxHosts:Frigate:IncidentAgent
  become: yes

  vars:
    promtail_version: "3.1.1"

  tasks:
    - name: Check if promtail binary is already installed
      stat:
        path: /usr/local/bin/promtail
      register: promtail_bin

    - name: Install unzip
      package:
        name: unzip
        state: present
      when: not promtail_bin.stat.exists

    - name: Download promtail archive
      # curl, not unarchive's remote_src HTTP fetch -- see the node_exporter
      # download task above for why.
      command: curl -sL -o /tmp/promtail-linux-amd64.zip "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
      when: not promtail_bin.stat.exists

    - name: Extract promtail archive
      unarchive:
        src: /tmp/promtail-linux-amd64.zip
        dest: /tmp
        remote_src: yes
      when: not promtail_bin.stat.exists

    - name: Install promtail binary
      copy:
        src: /tmp/promtail-linux-amd64
        dest: /usr/local/bin/promtail
        owner: root
        group: root
        mode: "0755"
        remote_src: yes
      when: not promtail_bin.stat.exists

    - name: Clean up extracted binary
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/promtail-linux-amd64
        - /tmp/promtail-linux-amd64.zip
      when: not promtail_bin.stat.exists

    - name: Create promtail user
      user:
        name: promtail
        system: yes
        shell: /usr/sbin/nologin
        create_home: no
        groups: systemd-journal
        append: yes

    - name: Create promtail data directory
      file:
        path: /var/lib/promtail
        state: directory
        owner: promtail
        group: promtail
        mode: "0750"

    - name: Create promtail config directory
      file:
        path: /etc/promtail
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy promtail config
      copy:
        dest: /etc/promtail/config.yml
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /var/lib/promtail/positions.yaml

          clients:
            - url: http://service.internal.levantine.io:3100/loki/api/v1/push

          scrape_configs:
            - job_name: journal
              journal:
                max_age: 12h
                labels:
                  job: journal
                  host: "{{ inventory_hostname_short }}"
              relabel_configs:
                - source_labels: ["__journal__systemd_unit"]
                  target_label: unit
        owner: root
        group: root
        mode: "0644"
      register: promtail_config

    - name: Deploy promtail systemd unit
      copy:
        dest: /etc/systemd/system/promtail.service
        content: |
          [Unit]
          Description=Promtail
          After=network.target

          [Service]
          User=promtail
          ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/config.yml
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: promtail_unit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: promtail_unit.changed or promtail_config.changed

    - name: Enable and start promtail
      systemd:
        name: promtail
        enabled: yes
        state: started

    - name: Restart promtail if config changed
      systemd:
        name: promtail
        state: restarted
      when: promtail_config.changed
