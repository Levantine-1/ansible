---
# Self-hosted GitHub Actions runner(s) -- replaces the old GitHub-cloud
# -> thisper -> Jenkins bridge (Jenkins decommissioned; thisper's
# forwarding routes removed in the same change that adds this). Runs on
# dockerhost1: already the designated home for less-trusted,
# internet-triggered workloads, and has zero access to service's
# automation credentials (Vault AppRole, AWS/Proxmox tokens,
# ansible-vault password).
#
# One runner per app repo (10 total), each its own systemd service.
# Neither Levantine-1 nor nhitruong96 is a real GitHub Organization (both
# are personal User accounts, confirmed live against the GitHub API --
# org-level runner registration returned 404), so there's no way to share
# one runner pool across a group of repos here; every repo needs its own
# separate registration.
- name: Install GitHub Actions self-hosted runners
  hosts: VMWareDockerHosts
  become: yes
  gather_facts: yes

  vars:
    runner_version: "2.336.0"
    runner_instances:
      - name: thisper
        repo: Levantine-1/thisper
        pat_vault_path: kv/data/github/levantine1
      - name: DataGateway
        repo: Levantine-1/DataGateway
        pat_vault_path: kv/data/github/levantine1
      - name: processMining
        repo: Levantine-1/processMining
        pat_vault_path: kv/data/github/levantine1
      - name: portfolio
        repo: Levantine-1/portfolio
        pat_vault_path: kv/data/github/levantine1
      - name: livecam
        repo: Levantine-1/livecam
        pat_vault_path: kv/data/github/levantine1
      - name: pet-care
        repo: nhitruong96/pet-care
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: dental-care
        repo: nhitruong96/dental-care
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: education-platform
        repo: nhitruong96/education-platform
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: real_estate
        repo: nhitruong96/real_estate
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: booking-movie-ticket
        repo: nhitruong96/booking-movie-ticket
        pat_vault_path: kv/data/github/nhitruong96_pat

  tasks:
    # kv/data/github/levantine1 (the rotated all-repos PAT) stores its
    # value under key `pat`; kv/data/github/nhitruong96_pat (an unrelated,
    # untouched, pre-existing secret for an external account) stores it
    # under `token` instead -- found live, a blanket .pat rename broke
    # this second one ("'dict object' has no attribute 'pat'"). Falls back
    # to whichever key is actually present rather than assuming one shape
    # for every secret under kv/data/github/.
    - name: Retrieve GitHub PATs from HashiCorp Vault
      set_fact:
        github_pats: "{{ github_pats | default({}) | combine({ item: (vault_secret.pat | default(vault_secret.token)) }) }}"
      vars:
        vault_secret: "{{ lookup('hashi_vault', 'secret=' + item + ' token=' + hashicorp_vault_token + ' url=' + hashicorp.vault.address) }}"
      loop: "{{ runner_instances | map(attribute='pat_vault_path') | unique | list }}"

    - name: Register and start each runner instance
      include_tasks: register_runner_instance.yml
      loop: "{{ runner_instances }}"
      loop_control:
        loop_var: runner
        label: "{{ runner.name }}"

    # Confirmed live (2026-09-03) as the entire cause of a DiskSpaceLow
    # incident: all 10 runners above silently accumulate a stale self-update
    # staging directory and (for repos whose CI runs terraform) a
    # provider-plugin cache, neither of which anything ever cleans up on its
    # own -- ~13.9GB the one time this was checked by hand, on a 32GB disk.
    # See files/prune_runner_work.sh's own header for exactly what's removed
    # and why each is safe. Deployed once here, runs on its own schedule on
    # the host from then on -- the IaC's job is making sure the pruner
    # exists and stays correct, not running it.
    - name: Deploy the runner-work pruning script
      copy:
        src: files/prune_runner_work.sh
        dest: /usr/local/bin/prune_runner_work.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy prune-runner-work systemd service
      copy:
        dest: /etc/systemd/system/prune-runner-work.service
        content: |
          [Unit]
          Description=Prune stale GitHub Actions runner work directories

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/prune_runner_work.sh
        owner: root
        group: root
        mode: "0644"
      register: prune_service_unit

    - name: Deploy prune-runner-work systemd timer
      # Daily, not more often -- this reaccumulates over days/weeks from
      # normal CI activity, not minutes, so there is no benefit to a
      # tighter cadence, only more log noise. Persistent=true so a run
      # missed while the host was down still happens once it's back,
      # rather than silently waiting a full day.
      copy:
        dest: /etc/systemd/system/prune-runner-work.timer
        content: |
          [Timer]
          OnCalendar=daily
          Persistent=true

          [Install]
          WantedBy=timers.target
        owner: root
        group: root
        mode: "0644"
      register: prune_timer_unit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: prune_service_unit.changed or prune_timer_unit.changed

    - name: Enable and start prune-runner-work.timer
      systemd:
        name: prune-runner-work.timer
        enabled: yes
        state: started
