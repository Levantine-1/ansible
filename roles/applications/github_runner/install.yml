---
# Self-hosted GitHub Actions runner(s) -- replaces the old GitHub-cloud
# -> thisper -> Jenkins bridge (Jenkins decommissioned; thisper's
# forwarding routes removed in the same change that adds this). Runs on
# dockerhost1: already the designated home for less-trusted,
# internet-triggered workloads, and has zero access to service's
# automation credentials (Vault AppRole, AWS/Proxmox tokens,
# ansible-vault password).
#
# One runner per app repo (9 total), each its own systemd service.
# Neither Levantine-1 nor nhitruong96 is a real GitHub Organization (both
# are personal User accounts, confirmed live against the GitHub API --
# org-level runner registration returned 404), so there's no way to share
# one runner pool across a group of repos here; every repo needs its own
# separate registration.
- name: Install GitHub Actions self-hosted runners
  hosts: VMWareDockerHosts
  become: yes
  gather_facts: yes

  vars:
    runner_version: "2.336.0"
    runner_instances:
      - name: thisper
        repo: Levantine-1/thisper
        pat_vault_path: kv/data/github/levantine1_org_pat
      - name: DataGateway
        repo: Levantine-1/DataGateway
        pat_vault_path: kv/data/github/levantine1_org_pat
      - name: processMining
        repo: Levantine-1/processMining
        pat_vault_path: kv/data/github/levantine1_org_pat
      - name: portfolio
        repo: Levantine-1/portfolio
        pat_vault_path: kv/data/github/levantine1_org_pat
      - name: pet-care
        repo: nhitruong96/pet-care
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: dental-care
        repo: nhitruong96/dental-care
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: education-platform
        repo: nhitruong96/education-platform
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: real_estate
        repo: nhitruong96/real_estate
        pat_vault_path: kv/data/github/nhitruong96_pat
      - name: booking-movie-ticket
        repo: nhitruong96/booking-movie-ticket
        pat_vault_path: kv/data/github/nhitruong96_pat

  tasks:
    - name: Retrieve GitHub PATs from HashiCorp Vault
      set_fact:
        github_pats: "{{ github_pats | default({}) | combine({ item: (lookup('hashi_vault', 'secret=' + item + ' token=' + hashicorp_vault_token + ' url=' + hashicorp.vault.address)).token }) }}"
      loop: "{{ runner_instances | map(attribute='pat_vault_path') | unique | list }}"

    - name: Register and start each runner instance
      include_tasks: register_runner_instance.yml
      loop: "{{ runner_instances }}"
      loop_control:
        loop_var: runner
        label: "{{ runner.name }}"
