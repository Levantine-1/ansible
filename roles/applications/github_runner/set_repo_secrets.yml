---
# Sets GitHub Actions repository secrets from values already held in Vault,
# so CI credentials have a declared source of truth instead of being pasted
# in by hand and then existing only inside GitHub.
#
# Runs on `service` because that's where the Vault AppRole credentials live
# (/etc/vault-approle.env) -- the same reason the vault_backup and opnsense
# roles do their git work there.
#
# GitHub's secrets API requires each value to be encrypted with the repo's
# own public key (libsodium sealed box) before upload, which is why the work
# happens in files/set_github_secrets.py rather than a couple of `uri`
# tasks. Values go Vault -> encrypt -> GitHub without ever being logged or
# written to disk; the script only ever prints secret *names* and HTTP
# statuses.
#
# Re-running is safe: GitHub treats a PUT to an existing secret as an
# update, so this converges rather than duplicating.
#
# Usage:
#   ansible-playbook -i inventories/production/production.ini \
#     roles/applications/github_runner/set_repo_secrets.yml
- name: Set GitHub Actions repository secrets from Vault
  hosts: service
  become: yes

  vars:
    # Each entry maps a GitHub secret to the Vault path/key holding its
    # value. Add a repo here rather than setting secrets through the web UI,
    # so the wiring stays reviewable.
    #
    # VAULT_TOKEN's value is minted by
    # hashicorp_vault/configure_livecam_ci_token.yml, which must run first
    # on a fresh setup -- it needs a root token, which this playbook
    # intentionally doesn't hold. Once that's stored the token is just
    # another Vault-sourced secret like the rest.
    github_repo_secrets:
      - repo: Levantine-1/livecam
        secret: AWS_ACCESS_KEY
        vault_path: kv/data/aws/iam_access_keys/terraform_livecam
        vault_key: access_key
      - repo: Levantine-1/livecam
        secret: AWS_SECRET_KEY
        vault_path: kv/data/aws/iam_access_keys/terraform_livecam
        vault_key: secret_key
      - repo: Levantine-1/livecam
        secret: SEMAPHORE_API_TOKEN
        vault_path: kv/data/semaphore/ci_api_token
        vault_key: token
      - repo: Levantine-1/livecam
        secret: VAULT_TOKEN
        vault_path: kv/data/github/ci_vault_token
        vault_key: token

  tasks:
    # The sealed-box encryption GitHub requires needs libsodium bindings.
    - name: Install pynacl (libsodium bindings for GitHub's sealed-box format)
      apt:
        name: python3-nacl
        state: present

    - name: Deploy the secret-setting helper
      copy:
        src: files/set_github_secrets.py
        dest: /usr/local/bin/set_github_secrets.py
        owner: root
        group: root
        mode: "0750"

    - name: Set the configured repository secrets
      command: /usr/local/bin/set_github_secrets.py
      args:
        stdin: "{{ github_repo_secrets | to_json }}"
      register: set_secrets
      changed_when: "'HTTP 2' in set_secrets.stdout"

    - name: Show result (names and statuses only -- never values)
      debug:
        var: set_secrets.stdout_lines
