# https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_module.html
#   ansible-galaxy collection install kubernetes.core
#     python >= 3.9
#     kubernetes >= 24.2.0
#     PyYAML >= 3.11
#     jsonpatch

---
  - name: Deploy DataGateway Kubernetes Configurations
    hosts: DataGatewayK8Cluster
    become: yes
    gather_facts: yes

    vars:
      aws_environment: # These will be filled in by the HashiCorp Vault lookup in this playbook
        AWS_ACCESS_KEY_ID: "{{ aws_creds.access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_creds.secret_key }}"
      aws_ecr_repo_path: "{{ aws.account_id }}.dkr.ecr.{{ aws.default_region }}.amazonaws.com/{{ DataGatewayK8Cluster.aws_ecr_repo_name }}"
      local_registry_path: "{{ DataGatewayK8Cluster.control_plane_endpoint }}:5000/{{ DataGatewayK8Cluster.aws_ecr_repo_name }}"
      existing_thisper_token: "" # Overwritten below if a valid one is already in Vault; stays empty (not undefined) if that lookup fails.

    vars_files:
      - ../../../vault.yml

    tasks:
      - block: # Everything in this block only runs on the controller node
        - name: Retrieve AWS Credentials from HashiCorp Vault
          # NOTE: The secret path is created in the main terraform repo when the user is created and key stored in vault at path below
          set_fact:
            aws_creds: "{{ lookup('hashi_vault', 'secret={{ DataGatewayK8Cluster.vault_aws_iam_key_path }} token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

        - name: Log in to AWS ECR
          shell: "aws ecr get-login-password --region {{ aws.default_region }} | docker login --username AWS --password-stdin {{ aws.account_id }}.dkr.ecr.{{ aws.default_region }}.amazonaws.com"
          environment: "{{ aws_environment }}"

        - name: Get the latest Docker image from ECR
          shell: "aws ecr describe-images --repository-name {{ DataGatewayK8Cluster.aws_ecr_repo_name }} --query 'sort_by(imageDetails, &imagePushedAt) | [-1].imageTags[0]' --output text --region {{ aws.default_region }}"
          environment: "{{ aws_environment }}"
          register: latest_image

        - name: Pull the Docker image from ECR
          command: "docker pull {{ aws_ecr_repo_path }}:{{ latest_image.stdout }}"

        - name: Tag the Docker image
          command: "docker tag {{ aws_ecr_repo_path }}:{{ latest_image.stdout }} {{ local_registry_path }}:{{ latest_image.stdout }}"

        # NOTE: 2024-08-14 Temporary Work around for disk consumption issues due to images pushed to the container not being deleted.
        # The images are stored within the container and I don't know how to do it through ansible at this time.
        # FYI, Ideally the local registry should be created by the provisioning playbook: configure_control_plane.yml
        # >>>>>>>>>>>>> START OF WORK AROUND >>>>>>>>>>>>>>>>>>
        - name: Delete the local Docker image registry
          docker_container:
            name: registry
            state: absent

        - name: Recreate the local Docker image registry
          docker_container:
            name: registry
            image: registry:latest
            state: started
            restart_policy: always
            ports:
              - "5000:5000"
            env:
              REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
        # <<<<<<<<<<<<<<<< END OF WORK AROUND <<<<<<<<<<<<<<<<<<<<

        - name: Push the Docker image to local repo
          command: "docker push {{ local_registry_path }}:{{ latest_image.stdout }}"

        - name: Prune Docker
          command: docker system prune -af

        - name: Retrieve Database Credentials from HashiCorp Vault
          set_fact:
            db_creds: "{{ lookup('hashi_vault', 'secret={{ DataGatewayK8Cluster.spring_datasource_password_vault_path }} token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

        - name: Install MySQL client library for the mysql_db module
          apt:
            name: python3-pymysql
            state: present

        # createDatabaseIfNotExist=true doesn't work through ProxySQL (see
        # group_vars/DataGatewayK8Cluster) -- the datagateway database has
        # no migration tool, so create it explicitly before every deploy.
        # A no-op once it already exists.
        - name: Ensure the datagateway database exists
          mysql_db:
            name: datagateway
            state: present
            login_host: proxysql.internal.levantine.io
            login_port: 6033
            login_user: "{{ DataGatewayK8Cluster.spring_datasource_username }}"
            login_password: "{{ db_creds[DataGatewayK8Cluster.spring_datasource_username] }}"

        - name: Create Kubernetes Deployment
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: datagateway
                namespace: default
              spec:
                replicas: 4
                selector:
                  matchLabels:
                    app: datagateway
                template:
                  metadata:
                    labels:
                      app: datagateway
                  spec:
                    containers:
                      - name: datagateway
                        image: "{{ local_registry_path }}:{{ latest_image.stdout }}"
                        env:
                          - name: spring.datasource.url
                            value: "{{ DataGatewayK8Cluster.spring_datasource_url }}"
                          - name: spring.datasource.username
                            value: "{{ DataGatewayK8Cluster.spring_datasource_username }}"
                          - name: spring.datasource.password
                            value: "{{ db_creds[DataGatewayK8Cluster.spring_datasource_username] }}"

        - name: Create Kubernetes Service
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Service
              metadata:
                name: datagateway-service
                namespace: default
              spec:
                type: NodePort
                ports:
                  - port: 8080
                    targetPort: 8080
                    # nodePort: "{{ DataGatewayK8Cluster.serviceNodePort | int }}"
                    # For some reason I'm getting a "nodePort not an integer" error when I try to use the above line
                    nodePort: 30080
                    protocol: TCP
                selector:
                  app: datagateway

        - name: Wait for DataGateway to accept requests
          uri:
            url: "http://localhost:{{ DataGatewayK8Cluster.serviceNodePort }}/"
            status_code: 200
          register: datagateway_ready
          until: datagateway_ready.status is defined and datagateway_ready.status == 200
          retries: 30
          delay: 10
          ignore_errors: yes # Pods may still be rolling out; matches the retry pattern used for Percona's readiness wait.

        # thisper's Authorization header only validates against a row in
        # Percona's auth_token table -- which has no backup and gets wiped
        # by a Percona rebuild (see roles/os_configs/files/rebuild_fleet.sh
        # header). /generateToken is NOT safe to call unconditionally on
        # every deploy: auth_token.token_hash has no unique constraint, so
        # calling it with the same deterministic seed twice (e.g. two
        # deploys in a row with no data loss in between) inserts a second
        # row instead of no-op'ing, and TokenInterceptor's findByTokenHash
        # then throws NonUniqueResultException on every protected endpoint
        # -- found live during the second soft-DR pass, after the first
        # version of this fix did exactly that. So: test the existing
        # Vault-stored token first, and only mint a new one if it's
        # actually gone (i.e. Percona really was wiped).
        - name: Look up the existing thisper token in Vault
          set_fact:
            existing_thisper_token: "{{ (lookup('hashi_vault', 'secret=' + DataGatewayK8Cluster.vault_secret_path + '/thisperAPIKey token=' + hashicorp_vault_token + ' url=' + hashicorp.vault.address)).api_key | default('') }}"
          ignore_errors: yes # Path may not exist yet on a genuinely first-ever deploy; existing_thisper_token stays "" from the play-level default above.

        - name: Check whether the existing thisper token still validates
          uri:
            url: "http://localhost:{{ DataGatewayK8Cluster.serviceNodePort }}/amIAGoodMouse"
            headers:
              Authorization: "{{ existing_thisper_token }}"
            status_code: 200
          register: existing_thisper_token_check
          ignore_errors: yes # 401 here is the expected signal to mint a new one, not a failure.
          when: existing_thisper_token | length > 0

        - name: Mint a fresh thisper token (existing one is missing or invalid)
          uri:
            url: "http://localhost:{{ DataGatewayK8Cluster.serviceNodePort }}/generateToken"
            method: POST
            body_format: json
            body:
              email: thisper-service@levantine.io
            status_code: 200
            return_content: yes
          register: new_thisper_token
          when: existing_thisper_token | length == 0 or existing_thisper_token_check.status | default(0) != 200

        - name: Store thisper's DataGateway API key in Vault
          community.hashi_vault.vault_write:
            url: "{{ hashicorp.vault.address }}"
            token: "{{ hashicorp_vault_token }}"
            path: "{{ DataGatewayK8Cluster.vault_secret_path }}/thisperAPIKey"
            data:
              data:
                api_key: "{{ new_thisper_token.content | trim | trim('\"') }}"
          when: new_thisper_token is defined and new_thisper_token.content is defined

        - name: Configure HA Proxy
          template:
              src: templates/haproxy.cfg.j2
              dest: /etc/haproxy/haproxy.cfg
          register: haproxy_config

        - name: Restart HA Proxy
          systemd:
              name: haproxy
              enabled: yes
              state: restarted
          when: haproxy_config.changed

        when: node is defined and node == "controller"
