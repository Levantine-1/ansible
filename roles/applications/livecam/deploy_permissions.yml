---
# Deploys livecam's per-user permission config to dockerhost1, where
# deployDockerImage.yml mounts it read-only into the container.
#
# Separate from the container deploy on purpose: changing who can see which
# camera is a config edit, and shouldn't require rebuilding and
# republishing an image through the whole CI pipeline.
#
# Usage:
#   ansible-playbook -i inventories/production/production.ini \
#     roles/applications/livecam/deploy_permissions.yml
- name: Deploy livecam permissions config
  hosts: VMWareDockerHosts
  become: yes

  tasks:
    - name: Create the livecam config and data directories
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /opt/livecam
        # Writable state (the SQLite egress counter). Kept outside the
        # config file so redeploying permissions never disturbs usage data.
        - /opt/livecam/data

    - name: Deploy permissions.yml
      copy:
        src: files/permissions.yml
        dest: /opt/livecam/permissions.yml
        owner: root
        group: root
        mode: "0644"
      register: livecam_perms

    # Which cameras support PTZ and how to reach them over ONVIF. Separate
    # file from permissions.yml on purpose -- see that file's own header
    # comment for why. Same deploy-without-rebuild reasoning as permissions:
    # adding a camera's ONVIF details shouldn't need a new image.
    - name: Deploy cameras.yml
      copy:
        src: files/cameras.yml
        dest: /opt/livecam/cameras.yml
        owner: root
        group: root
        mode: "0644"
      register: livecam_cameras

    # The container reads these at request time rather than caching them, so
    # a restart isn't strictly required -- but restarting makes the change
    # take effect predictably instead of depending on that assumption.
    - name: Restart livecam so the new config is definitely in effect
      docker_container:
        name: livecam
        state: started
        restart: yes
      when: livecam_perms.changed or livecam_cameras.changed
      ignore_errors: yes  # container may not be deployed yet on a fresh host
