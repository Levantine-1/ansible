# Accounts and per-user camera permissions for livecam
# (livecam.levantine.io / livecam-lan.levantine.io).
#
# Deployed to /opt/livecam/permissions.yml on dockerhost1 and mounted
# read-only into the container. Config, not secrets -- only password
# *hashes* live here, so it belongs in git where changes are reviewable,
# and editing it needs no image rebuild or redeploy.
#
# This file is the whole account system: a user exists because they appear
# here with a password_hash. There is no self-registration -- accounts are
# added by editing this file and re-running the playbook, which is the right
# trade for a handful of family members.
#
# livecam is the only login now. Frigate replaced ZoneMinder for recording
# and playback, and Frigate's own auth is disabled in favour of proxy
# authentication -- livecam authenticates, then passes the username on. One
# account per person, not two.
#
# Generate a hash without ever committing the password:
#
#   python3 -c "from werkzeug.security import generate_password_hash as h; \
#               import getpass; print(h(getpass.getpass()))"
#
# pbkdf2 rather than werkzeug's newer scrypt default, purely for
# portability: a hash written by whatever werkzeug is installed on the
# machine generating it has to be verifiable by whatever version the
# container image happens to pull.
#
# livecam enforces three things per user: which cameras, where audio is
# permitted, and a time-of-day window.
#
# `audio`, `ptz` and `talk` all take the same form:
#
#   audio: true                  every camera this user may see
#   audio: false                 none
#   audio: [the-boiz, baby-cam]  only those
#
# The list is intersected with `cameras`, so naming a camera under any of
# them that the user cannot see grants nothing -- none can become a way to
# reach a camera the allow-list withheld.
#
# `ptz` and `talk` additionally require the camera to declare the capability
# in cameras.yml. Both gates are required: a grant here on a camera with no
# speaker (or no PTZ) does nothing.
#
# Camera names here are the machine slugs from group_vars/Frigate, not the
# display names. They must match exactly: a name that no longer matches a
# go2rtc stream silently removes that camera from everyone's access.
#
# Camera names must match the go2rtc stream names, which come from the
# `cameras` list in group_vars/Frigate.

# Password in Vault at kv/data/livecam/users, key `admin` -- stored there so
# it's recoverable, since only the hash exists here and hashes don't reverse.
# `recordings: true` grants Frigate -- the timeline, scrubbing, export and
# every recorded clip. It is a separate grant from live viewing because
# Frigate has no per-camera or per-audio gating that matches the model
# below: anyone who reaches it sees every camera and hears recorded audio.
# So it stays off by default and goes only to accounts that should have
# unrestricted access to the archive.
admin:
  password_hash: "pbkdf2:sha256:600000$cPw3P8h1Lkq5HyZ7$ac15a26d8b989fbb4171e69f9af1ee0f6de44ba8ca2530e06ab8094f856eb1ed"
  cameras:
    - the-boiz
    - the-gurlz
    - baby-ptz
  audio: true
  ptz: [baby-ptz]
  # Push audio to the camera's speaker (soundboard clips and recorded voice
  # clips). Same true/false/list shape as `audio` and `ptz`, and like them it
  # also needs the camera itself declared capable in cameras.yml.
  talk: [baby-ptz]
  recordings: true

# Shared account for the rest of the household. livecam only -- there is no
# recordings grant (see below), which is the intended boundary: live
# viewing for family, the recorded archive for the admin account.
#
# audio: false is enforced server-side by which go2rtc stream gets
# requested (the _noaudio variants have the track genuinely removed, not
# muted), so it cannot be turned back on from the browser.
#
# The password is deliberately short and memorable at the owner's request.
# That is a real tradeoff on an internet-facing login, mitigated by the
# per-IP throttle in livecam.py (10 failures per 5 minutes) and bounded by
# what the account can reach: live video of guinea pigs, no audio, no
# recordings, no settings. Password in Vault at kv/data/livecam/users.
family:
  password_hash: "pbkdf2:sha256:600000$CioPzqEyAPnpLBk4$c9363e50a2d103561aa61802b66f4ec08a210c99a17115028770b79c42fe8642"
  cameras:
    - the-boiz
    - the-gurlz
  audio: false
  # No recordings access: this account is deliberately audio-free, and
  # Frigate would hand over recorded audio for both cameras.
  recordings: false

# Template for a restricted family viewer -- one camera, no audio, daytime
# only. Copy, rename, and give it its own hash. The time window is
# re-evaluated per chunk while a stream runs, so it ends a live view at
# 20:00 rather than merely refusing to start a new one.
#
# `ptz` follows the same shape as `audio` (true/false/[camera list],
# intersected with `cameras`) -- but even a full grant here does nothing
# without the same camera also being declared in cameras.yml. Both are
# required. No camera is declared there today, so this is inert either way.
#
# guest:
#   password_hash: "pbkdf2:sha256:600000$..."
#   cameras:
#     - the-boiz
#   audio: false
#   ptz: false
#   recordings: false
#   time_window:
#     start: "08:00:00"
#     end: "20:00:00"
