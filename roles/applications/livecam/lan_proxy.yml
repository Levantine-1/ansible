---
# Puts livecam's LAN hostname on an address the home network can actually
# reach.
#
# The first attempt pointed livecam-lan.levantine.io straight at
# dockerhost1 (192.168.1.31) and was verified from `service`, which is
# inside that network -- so it passed while being broken for every real
# client. dockerhost1 is vmbr1-only, and the home LAN sits on OPNsense's
# WAN side, so 10.69.69.x cannot route to it at all.
#
# `service` is dual-homed onto both networks and already terminates nginx
# here; roles/applications/ops_dashboard proxies OPNsense from this host
# for precisely the same reason. This play adds a vhost next to that one.
#
# Depends on roles/os_configs/deploySSLCerts.yml having run for `service`
# (it targets Nginx:service now), which is also what keeps the cert fresh
# when the renewal timer fires.
#
# Usage:
#   ansible-playbook -i inventories/production/production.ini \
#     roles/applications/livecam/lan_proxy.yml
- name: Deploy livecam LAN reverse proxy
  hosts: service
  become: yes

  vars:
    livecam_lan_hostname: livecam-lan.levantine.io
    # service's WAN-side address, and what the public Route53 record for
    # livecam-lan points at. Documented here rather than looked up because
    # the DNS record hardcodes it too -- if one moves, both must.
    livecam_lan_listen_address: 10.69.69.50
    # Must match the proxy_pass host in templates/livecam-lan.conf.j2.
    livecam_lan_upstream: dockerhost1.internal.levantine.io

  tasks:
    - name: Install nginx
      # ops_dashboard installs it too, but this play must stand alone --
      # deploySSLCerts.yml already learned that lesson on a from-scratch
      # host (see its own comment).
      package:
        name: nginx
        state: present

    - name: Verify the wildcard certificate is present
      # Failing here with a clear message beats nginx refusing to start
      # later with "cannot load certificate", which takes the ops dashboard
      # down with it.
      stat:
        path: /etc/nginx/certs/levantine.io/fullchain.pem
      register: livecam_lan_cert

    - name: Fail if the certificate is missing
      fail:
        msg: >-
          /etc/nginx/certs/levantine.io/fullchain.pem is missing on {{ inventory_hostname }}.
          Run roles/os_configs/deploySSLCerts.yml first.
      when: not livecam_lan_cert.stat.exists

    - name: Deploy the livecam-lan nginx site config
      template:
        src: templates/livecam-lan.conf.j2
        dest: /etc/nginx/conf.d/livecam-lan.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    # livecam-lan.conf proxies to a hostname (dockerhost1.internal...) that
    # only OPNsense's Unbound can resolve, and nginx resolves proxy_pass
    # hostnames once, at startup -- an unresolvable one fails the config
    # test and nginx refuses to start at all, taking the ops dashboard and
    # every other vhost on this host down with it.
    #
    # Found live in the 2026-11-09 power-outage recovery: service and
    # opnsense boot in parallel from the same Proxmox host, service won the
    # race, nginx hit "host not found in upstream" and systemd never tried
    # again. The wait gives OPNsense up to ~5 minutes to start answering
    # (then starts regardless, so nginx -t reports the real error if DNS is
    # genuinely broken); Restart= covers anything that still slips through.
    - name: Create the nginx systemd drop-in directory
      file:
        path: /etc/systemd/system/nginx.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Make nginx wait for internal DNS and retry on failure
      copy:
        dest: /etc/systemd/system/nginx.service.d/wait-for-internal-dns.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible: roles/applications/livecam/lan_proxy.yml
          [Unit]
          Wants=network-online.target
          After=network-online.target
          StartLimitIntervalSec=0

          [Service]
          ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do getent hosts {{ livecam_lan_upstream }} >/dev/null && exit 0; sleep 5; done; echo "internal DNS still not resolving {{ livecam_lan_upstream }}, starting anyway" >&2'
          Restart=on-failure
          RestartSec=15s
      register: nginx_dns_dropin

    - name: Reload systemd after changing the nginx drop-in
      systemd:
        daemon_reload: yes
      when: nginx_dns_dropin.changed

    - name: Ensure nginx is enabled and running
      systemd:
        name: nginx
        enabled: yes
        state: started

    # Handlers run at the end of the play, so without this the checks below
    # would test the old config.
    - name: Apply the new site config now
      meta: flush_handlers

    # --resolve, not a plain URL: this host's own resolver answers
    # livecam-lan with dockerhost1's address (the OPNsense override, which
    # keeps internal traffic off service's WAN leg), so a normal request
    # would sail past the vhost being tested and report success no matter
    # what nginx here is doing. Pinning the name to the local address while
    # keeping SNI and certificate validation intact is the point.
    - name: Check that the new vhost answers locally and reaches livecam
      command: >-
        curl -sS --max-time 15
        --resolve {{ livecam_lan_hostname }}:443:{{ livecam_lan_listen_address }}
        -o /dev/null -w '%{http_code} %{ssl_verify_result}'
        https://{{ livecam_lan_hostname }}/login
      register: livecam_lan_probe
      changed_when: false
      retries: 3
      delay: 5
      until: livecam_lan_probe.stdout == "200 0"
      failed_when: livecam_lan_probe.stdout != "200 0"

    - name: Report the LAN entrance
      debug:
        msg: >-
          https://{{ livecam_lan_hostname }} answers 200 with a valid certificate
          at {{ livecam_lan_listen_address }} and proxies through to livecam.

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
