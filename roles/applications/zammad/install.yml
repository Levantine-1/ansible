---
# Zammad -- FOSS ticketing, no Elasticsearch (see docker-compose.yml.j2).
# Runs on `service` alongside Semaphore and the monitoring stack. Once
# deployed, Alertmanager's webhook receiver is pointed at Zammad's API to
# turn alerts into tickets (roles/applications/monitoring/files/
# alertmanager.yml's placeholder receiver).
- name: Deploy Zammad
  hosts: service
  become: yes

  tasks:
    - name: Retrieve Zammad secrets from HashiCorp Vault
      set_fact:
        zammad_secrets: "{{ lookup('hashi_vault', 'secret=kv/data/zammad/admin token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

    - name: Create /opt/zammad directory
      file:
        path: /opt/zammad
        state: directory
        owner: automation
        group: automation
        mode: "0750"

    - name: Deploy docker-compose.yml
      # 0640 not 0644: has the Postgres password interpolated directly in.
      template:
        src: templates/docker-compose.yml.j2
        dest: /opt/zammad/docker-compose.yml
        owner: automation
        group: automation
        mode: "0640"

    - name: Pull Zammad stack images
      command: docker compose pull
      args:
        chdir: /opt/zammad

    - name: Start Zammad via docker compose
      command: docker compose up -d
      args:
        chdir: /opt/zammad

    # Header SSO, so home-LAN browsers skip the login (2026-11-10): host
    # nginx sends X-Forwarded-User on /auth/sso, and only for LAN clients
    # (ops_dashboard's ops-dashboard.conf.j2, "No-login access"). Safe to
    # enable here even before ops_dashboard runs: until then nothing sends
    # that header, and zammad-nginx (the only published path besides
    # loopback 18081) strips it.
    - name: Enable Zammad header SSO (auth_sso)
      command: >-
        docker compose exec -T zammad-railsserver bundle exec rails r
        'if Setting.get("auth_sso") then puts "auth_sso unchanged" else Setting.set("auth_sso", true); puts "auth_sso enabled" end'
      args:
        chdir: /opt/zammad
      register: zammad_auth_sso
      changed_when: "'auth_sso enabled' in zammad_auth_sso.stdout"
      # The Rails server may still be booting right after `up -d`.
      retries: 12
      delay: 10
      until: zammad_auth_sso.rc == 0
