# One-time bootstrap: writes the two Vault secrets this project needs
# (kv/data/cameras/amcrest, kv/data/livecam/admin) that service-host's own
# AppRole has no write access to by design (its policy only grants read on
# these paths -- see files/policies/service-host.hcl). Same reasoning as
# hashicorp_vault/configure_vault_auth.yml using a root token directly:
# a handful of secrets are meant to be human-seeded, not automation-
# writable, so this can't bootstrap itself off the AppRole token.
#
# Idempotent and non-destructive: reads whatever already exists at those
# paths and only generates values that are genuinely missing. Re-running it
# is a no-op rather than a silent rotation. (The first version regenerated
# every password on every run, which would have desynced Vault from ZM's
# live admin password until frigate/install.yml
# happened to re-run.)
#
# The camera's RTSP password is a required extra-var with no default -- it
# must never be hardcoded here. An earlier version of this file had it
# inline, which put a live credential in git history.
#
# Usage (first-time seed):
#   ansible-playbook -i inventories/production/production.ini \
#     roles/applications/frigate/seed_vault_secrets.yml \
#     --extra-vars "vault_root_token=<root token> camera_password=<rtsp password>"
#
# Re-running later (values already in Vault) needs only the root token --
# camera_password is optional once kv/data/cameras/amcrest exists.
---
- name: Seed Vault secrets for the camera/livecam project
  hosts: service
  become: yes

  vars_files:
    - ../../../vault.yml

  vars:
    camera_username: admin

  tasks:
    - name: Read existing camera secret (if any)
      uri:
        url: "{{ hashicorp.vault.address }}/v1/kv/data/cameras/amcrest"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        status_code: [200, 404]
      register: existing_cameras
      no_log: true

    - name: Read existing livecam secret (if any)
      uri:
        url: "{{ hashicorp.vault.address }}/v1/kv/data/livecam/admin"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        status_code: [200, 404]
      register: existing_livecam
      no_log: true

    - name: Establish current values
      set_fact:
        current_cameras: "{{ (existing_cameras.json.data.data | default({})) if existing_cameras.status == 200 else {} }}"
        current_livecam: "{{ (existing_livecam.json.data.data | default({})) if existing_livecam.status == 200 else {} }}"
      no_log: true

    - name: Require camera_password when there is nothing stored yet
      assert:
        that: camera_password is defined
        fail_msg: >-
          kv/data/cameras/amcrest has no stored password and camera_password
          was not supplied. Re-run with --extra-vars "camera_password=<rtsp password>".

    # Each value falls back through: what's already in Vault -> what was
    # passed in -> a freshly generated one. So existing installs keep
    # working and only genuinely-absent values get created.
    - name: Compose the secret values
      set_fact:
        flask_secret_key: "{{ current_livecam.flask_secret_key | default(lookup('ansible.builtin.password', '/dev/null length=64 chars=hexdigits') | lower) }}"
        rtsp_username: "{{ current_cameras.username | default(camera_username) }}"
        rtsp_password: "{{ current_cameras.password | default(camera_password | default('')) }}"
      no_log: true

    - name: Write kv/data/cameras/amcrest
      uri:
        url: "{{ hashicorp.vault.address }}/v1/kv/data/cameras/amcrest"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          data:
            username: "{{ rtsp_username }}"
            password: "{{ rtsp_password }}"
        status_code: 200
      no_log: true

    - name: Write kv/data/livecam/admin
      uri:
        url: "{{ hashicorp.vault.address }}/v1/kv/data/livecam/admin"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          data:
            # The only livecam secret left. The zm_db_* credentials that
            # used to live here went with ZoneMinder -- livecam has its own
            # accounts and never touches a recorder's database.
            flask_secret_key: "{{ flask_secret_key }}"
        status_code: 200
      no_log: true
