# One-time bootstrap: writes the two Vault secrets this project needs
# (kv/data/cameras/amcrest, kv/data/livecam/admin) that service-host's own
# AppRole has no write access to by design (its policy only grants read on
# these paths -- see files/policies/service-host.hcl). Same reasoning as
# hashicorp_vault/configure_vault_auth.yml using a root token directly:
# a handful of secrets are meant to be human-seeded, not automation-
# writable, so this can't bootstrap itself off the AppRole token.
#
# Safe to re-run -- generates fresh random values each time, so only run
# this again if you actually want to rotate zm_admin_password/
# livecam_db_password (and re-run camera_nvr/install.yml afterward if so,
# since it sets ZM's admin password and the DB user's password to match).
#
# Usage:
#   ansible-playbook -i inventories/production/production.ini \
#     roles/applications/camera_nvr/seed_vault_secrets.yml \
#     --extra-vars "vault_root_token=<root token>"
---
- name: Seed Vault secrets for the camera/livecam project
  hosts: service
  become: yes

  vars_files:
    - ../../../vault.yml

  tasks:
    - name: Generate random values
      set_fact:
        zm_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
        livecam_db_password: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
        flask_secret_key: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=hexdigits') | lower }}"
      no_log: true

    - name: Write kv/data/cameras/amcrest
      uri:
        url: "{{ hashicorp.vault.address }}/v1/kv/data/cameras/amcrest"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          data:
            username: "admin"
            password: "REDACTED-SEE-VAULT"
            zm_admin_password: "{{ zm_admin_password }}"
            livecam_db_password: "{{ livecam_db_password }}"
        status_code: 200
      no_log: true

    - name: Write kv/data/livecam/admin
      uri:
        url: "{{ hashicorp.vault.address }}/v1/kv/data/livecam/admin"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          data:
            flask_secret_key: "{{ flask_secret_key }}"
            zm_db_host: "cameras.internal.levantine.io"
            zm_db_user: "livecam_ro"
            zm_db_password: "{{ livecam_db_password }}"
        status_code: 200
      no_log: true
