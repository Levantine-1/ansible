---
# Installs and configures ZoneMinder on the `cameras` VM: RTSP ingestion,
# continuous (no motion analysis) recording of the guinea pig cage cameras
# to the dedicated 2TB HDD, and ZM's own native web console (login,
# per-user per-camera restriction, live/event browsing). Assumes the bone-
# stock Debian 12 baseline from all.yml has already run.
#
# ZM's web console stays LAN-only by construction -- this VM has a single
# NIC on vmbr1 (see terraform/proxmox/cameras.tf), no separate public
# network path to lock down. The public-facing piece (livecam.levantine.io)
# is a separate app in its own repo, deployed on dockerhost1, that talks to
# this host over the internal LAN -- see that repo for the auth/permission
# layer ZM doesn't provide natively.
- name: Install and configure ZoneMinder
  hosts: Cameras
  become: yes

  vars_files:
    - ../../../vault.yml

  tasks:
    # Holds both the Amcrest RTSP username/password and ZM's own web
    # console admin password (zm_admin_password) -- one shared secret for
    # everything under the "cameras" domain rather than a second Vault path
    # just for one more string.
    - name: Retrieve camera RTSP credentials from Vault
      set_fact:
        camera_secrets: "{{ lookup('hashi_vault', 'secret=kv/data/cameras/amcrest token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"
      no_log: true

    - name: Check if the footage disk is already formatted
      command: blkid -o value -s TYPE /dev/sdb
      register: nvr_disk_blkid
      changed_when: false
      failed_when: false

    # /dev/sdb, not resolved by-id: this repo's other disk-handling
    # automation (resize_main_diskPartitionWrapper.yml) makes the same
    # simple-device-name assumption for /dev/sda, so this matches existing
    # convention rather than introducing a new one.
    - name: Format the footage disk (scsi1, ext4)
      filesystem:
        fstype: ext4
        dev: /dev/sdb
      when: nvr_disk_blkid.stdout == ""

    - name: Create the footage mount point
      file:
        path: /mnt/nvr-hdd
        state: directory
        mode: "0755"

    - name: Mount the footage disk
      mount:
        path: /mnt/nvr-hdd
        src: /dev/sdb
        fstype: ext4
        state: mounted

    - name: Install ZoneMinder and its dependencies
      apt:
        name:
          - zoneminder
          - mariadb-server
          - apache2
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Ensure MariaDB is running
      service:
        name: mariadb
        state: started
        enabled: yes

    # The package ships /etc/zm/zm.conf already pointing at
    # ZM_DB_NAME=zm/ZM_DB_USER=zmuser/ZM_DB_PASS=zmpass (the package's own
    # well-known plaintext defaults, not a real secret -- it's shipped in
    # that same local, root-only-readable conf file either way), but
    # doesn't create the database or DB user for a non-interactive install
    # (normally done via debconf prompts, which apt with a plain `state:
    # present` never triggers). zmupdate.pl -f assumes both already exist.
    - name: Create ZoneMinder's database
      mysql_db:
        name: zm
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create ZoneMinder's database user
      mysql_user:
        name: zmuser
        password: zmpass
        priv: "zm.*:ALL"
        host: "localhost"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    # `USE zm; SHOW TABLES;` alone isn't a valid "already set up" check --
    # it succeeds (rc=0) on a freshly-created, still-empty database too,
    # found live (skipped zmupdate.pl entirely on a genuinely fresh
    # install, cascading into "Set ZoneMinder admin password" failing with
    # no Users table to operate on). Checking for a specific table
    # zmupdate.pl actually creates is the real signal.
    - name: Check if ZoneMinder's database is already set up
      command: mysql -u root -N -e "USE zm; SHOW TABLES LIKE 'Monitors';"
      register: zm_db_check
      changed_when: false
      failed_when: false

    # zmupdate.pl -f is NOT the initial-schema-load tool despite being the
    # package's documented one-liner for this -- found live, it assumes
    # core tables (Config, etc.) already exist and fails outright on a
    # genuinely empty database ("Table 'zm.Config' doesn't exist"). The
    # real initial schema ships as a plain SQL file; zmupdate.pl is only
    # for version-to-version migrations on top of that.
    - name: Load ZoneMinder's initial database schema
      command: >
        mysql -u root zm -e "source /usr/share/zoneminder/db/zm_create.sql"
      when: "'Monitors' not in zm_db_check.stdout"

    # Safe/idempotent to run either way -- brings a freshly-loaded schema
    # up to whatever point releases this package version expects, same as
    # it would on a genuine upgrade.
    - name: Apply any pending ZoneMinder schema migrations
      command: zmupdate.pl -f
      when: "'Monitors' not in zm_db_check.stdout"

    # zmuser.pl doesn't exist in this ZM version (1.36.x) -- found live,
    # the package's own bin/ list has no such script anymore; user
    # management moved entirely to the web UI/API. zm_create.sql seeds a
    # single admin account with ZM's well-known default bcrypt hash for
    # the password "admin" (meant to be changed on first login). Idempotent
    # across re-runs by trying that default login first: succeeds only on
    # a genuinely fresh install, in which case the password gets changed
    # via the API's own user-edit endpoint (which handles ZM's bcrypt
    # hashing correctly, same as the web UI's edit-user form would);
    # already-rotated installs just fail this login and move on.
    - name: Try logging in with ZoneMinder's default seed password
      uri:
        url: "http://localhost/zm/api/host/login.json"
        method: POST
        body_format: form-urlencoded
        body:
          user: "admin"
          pass: "admin"
        status_code: [200, 401]
      register: zm_default_login
      no_log: true

    - name: Set ZoneMinder admin password via the API
      uri:
        url: "http://localhost/zm/api/users/1.json?token={{ zm_default_login.json.access_token }}"
        method: PUT
        body_format: json
        body:
          User:
            Password: "{{ camera_secrets.zm_admin_password }}"
        status_code: 200
      when: zm_default_login.status == 200
      no_log: true

    # MariaDB defaults to 127.0.0.1-only -- livecam (on dockerhost1) needs
    # to reach ZM's Sessions table remotely to resolve a session cookie to
    # a ZM username (see livecam's own README). Bound to this VM's own LAN
    # IP specifically, not 0.0.0.0, so it's not reachable from anywhere
    # broader than the internal network this VM is already only on.
    - name: Let MariaDB listen on the LAN interface
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: "bind-address = 192.168.1.85"
      notify: Restart MariaDB

    # Dedicated read-only account, not ZM's own root/app credentials --
    # scoped to exactly the one table livecam actually needs (Sessions, to
    # resolve who a forwarded session cookie belongs to), nothing else in
    # the zm database.
    - name: Create livecam's read-only DB user
      mysql_user:
        name: livecam_ro
        password: "{{ camera_secrets.livecam_db_password }}"
        host: "192.168.1.31"
        priv: "zm.Sessions:SELECT"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

    - name: Add www-data to the video group (camera device/capture access)
      user:
        name: www-data
        groups: video
        append: yes

    - name: Enable required Apache modules for ZoneMinder
      command: "a2enmod {{ item }}"
      args:
        creates: "/etc/apache2/mods-enabled/{{ item }}.load"
      loop:
        - cgi
        - rewrite

    # ZoneMinder's package ships its Apache config under conf-available/,
    # not sites-available/ -- found live (a2ensite failed outright since
    # sites-available/zoneminder.conf doesn't exist; the package's actual
    # file is conf-available/zoneminder.conf, which needs a2enconf instead).
    - name: Enable ZoneMinder's Apache config
      command: a2enconf zoneminder
      args:
        creates: /etc/apache2/conf-enabled/zoneminder.conf
      notify: Restart Apache

    # Points ZM's event/frame storage at the dedicated HDD instead of the
    # SSD-backed OS disk. This is the simple, reliably-automatable global
    # setting; ZM 1.34+'s multi-"Storage Area" feature (which adds the
    # built-in max-usage/pruning behavior the plan calls for) still needs a
    # one-time pass through ZM's own web console to point the storage area
    # at this same path and set its usage limit -- not automated here since
    # it depends on the exact installed ZM version's UI/API shape.
    - name: Point ZoneMinder's event storage at the footage disk
      lineinfile:
        path: /etc/zm/conf.d/01-nvr-storage.conf
        line: "ZM_DIR_EVENTS=/mnt/nvr-hdd"
        create: yes
        mode: "0644"
      notify: Restart ZoneMinder

    - name: Ensure /mnt/nvr-hdd is owned by ZoneMinder's service user
      file:
        path: /mnt/nvr-hdd
        owner: www-data
        group: www-data

    - name: Ensure ZoneMinder is running and enabled
      service:
        name: zoneminder
        state: started
        enabled: yes

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes

    # Handlers only fire at the end of the play by default -- the API
    # login task right below needs the newly-enabled zoneminder conf
    # already loaded, not queued behind everything else.
    - meta: flush_handlers

    # ZM's REST API needs API access enabled (ZM_OPT_USE_API, on by default
    # in recent packaged versions) -- verify against the installed version
    # if the login step below 401s unexpectedly.
    - name: Log in to ZoneMinder's API
      uri:
        url: "http://localhost/zm/api/host/login.json"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ zm_admin_user | default('admin') }}"
          pass: "{{ camera_secrets.zm_admin_password }}"
        status_code: 200
      register: zm_login
      no_log: true

    - name: Get existing monitors
      uri:
        url: "http://localhost/zm/api/monitors.json?token={{ zm_login.json.access_token }}"
        method: GET
        status_code: 200
      register: zm_existing_monitors

    # Function=Record (not Modect/Mocord): deliberately the lightest-CPU ZM
    # mode -- skips the motion-analysis daemon entirely, which is exactly
    # right given no motion/AI detection is wanted and the FX8200's CPU is
    # old. Save Jpegs / video writer mode is left at the package default
    # here -- verify it's set to direct/passthrough recording (not legacy
    # per-frame JPEG capture) in the web console before relying on the
    # storage math in the plan, since the exact setting name varies by ZM
    # version and isn't safe to guess at via the API blind.
    - name: Create a Monitor for each camera
      uri:
        url: "http://localhost/zm/api/monitors.json?token={{ zm_login.json.access_token }}"
        method: POST
        body_format: json
        body:
          Monitor:
            Name: "{{ item.name }}"
            Function: "Record"
            Protocol: "rtsp"
            Method: "rtpRtsp"
            Host: "{{ item.ip }}"
            Port: "554"
            Path: "/cam/realmonitor?channel={{ item.channel | default(1) }}&subtype=0"
            User: "{{ camera_secrets.username }}"
            Pass: "{{ camera_secrets.password }}"
            Width: "{{ item.width | default(2560) }}"
            Height: "{{ item.height | default(1440) }}"
        status_code: [200, 201]
      loop: "{{ cameras }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in (zm_existing_monitors.json.monitors | default([]) | map(attribute='Monitor.Name') | list)
      no_log: true

  handlers:
    - name: Restart ZoneMinder
      service:
        name: zoneminder
        state: restarted

    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted

    - name: Restart Apache
      service:
        name: apache2
        state: restarted
