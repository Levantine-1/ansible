---
# Installs and configures ZoneMinder on the `cameras` VM: RTSP ingestion,
# continuous (no motion analysis) recording of the guinea pig cage cameras
# to the dedicated 2TB HDD, and ZM's own native web console (login,
# per-user per-camera restriction, live/event browsing). Assumes the bone-
# stock Debian 12 baseline from all.yml has already run.
#
# ZM's web console stays LAN-only by construction -- this VM has a single
# NIC on vmbr1 (see terraform/proxmox/cameras.tf), no separate public
# network path to lock down. The public-facing piece (livecam.levantine.io)
# is a separate app in its own repo, deployed on dockerhost1, that talks to
# this host over the internal LAN -- see that repo for the auth/permission
# layer ZM doesn't provide natively.
- name: Install and configure ZoneMinder
  hosts: Cameras
  become: yes

  vars_files:
    - ../../../vault.yml

  tasks:
    # Holds both the Amcrest RTSP username/password and ZM's own web
    # console admin password (zm_admin_password) -- one shared secret for
    # everything under the "cameras" domain rather than a second Vault path
    # just for one more string.
    - name: Retrieve camera RTSP credentials from Vault
      set_fact:
        camera_secrets: "{{ lookup('hashi_vault', 'secret=kv/data/cameras/amcrest token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"
      no_log: true

    - name: Check if the footage disk is already formatted
      command: blkid -o value -s TYPE /dev/sdb
      register: nvr_disk_blkid
      changed_when: false
      failed_when: false

    # /dev/sdb, not resolved by-id: this repo's other disk-handling
    # automation (resize_main_diskPartitionWrapper.yml) makes the same
    # simple-device-name assumption for /dev/sda, so this matches existing
    # convention rather than introducing a new one.
    - name: Format the footage disk (scsi1, ext4)
      filesystem:
        fstype: ext4
        dev: /dev/sdb
      when: nvr_disk_blkid.stdout == ""

    # Mounted directly at ZoneMinder's OWN default events path, not at a
    # separate /mnt/nvr-hdd that ZM then has to be told about. Learned the
    # hard way: the first version mounted at /mnt/nvr-hdd and set
    # ZM_DIR_EVENTS=/mnt/nvr-hdd in /etc/zm/conf.d/, which ZM 1.36 silently
    # ignores for event storage -- it takes the path from the `Storage`
    # database table instead, which still pointed at the OS disk. Result:
    # every recording landed on the 16GB root filesystem and filled it to
    # 100% in about an hour while the 1.9TB disk sat empty.
    #
    # Making ZM's default correct (rather than overriding it) means there's
    # no config or DB row that can drift back: a schema reload, a DB
    # reinit, or a fresh install all still write to this disk. Mounted
    # before the zoneminder package installs so the package's own postinst
    # sets up its directory tree on the right filesystem from the start.
    - name: Create ZoneMinder's events directory (the footage mount point)
      file:
        path: /var/cache/zoneminder/events
        state: directory
        mode: "0755"

    - name: Mount the footage disk at ZoneMinder's events path
      mount:
        path: /var/cache/zoneminder/events
        src: /dev/sdb
        fstype: ext4
        state: mounted

    - name: Install ZoneMinder and its dependencies
      apt:
        name:
          - zoneminder
          - mariadb-server
          - apache2
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Ensure MariaDB is running
      service:
        name: mariadb
        state: started
        enabled: yes

    # The package ships /etc/zm/zm.conf already pointing at
    # ZM_DB_NAME=zm/ZM_DB_USER=zmuser/ZM_DB_PASS=zmpass (the package's own
    # well-known plaintext defaults, not a real secret -- it's shipped in
    # that same local, root-only-readable conf file either way), but
    # doesn't create the database or DB user for a non-interactive install
    # (normally done via debconf prompts, which apt with a plain `state:
    # present` never triggers). zmupdate.pl -f assumes both already exist.
    - name: Create ZoneMinder's database
      mysql_db:
        name: zm
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create ZoneMinder's database user
      mysql_user:
        name: zmuser
        password: zmpass
        priv: "zm.*:ALL"
        host: "localhost"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    # `USE zm; SHOW TABLES;` alone isn't a valid "already set up" check --
    # it succeeds (rc=0) on a freshly-created, still-empty database too,
    # found live (skipped zmupdate.pl entirely on a genuinely fresh
    # install, cascading into "Set ZoneMinder admin password" failing with
    # no Users table to operate on). Checking for a specific table
    # zmupdate.pl actually creates is the real signal.
    - name: Check if ZoneMinder's database is already set up
      command: mysql -u root -N -e "USE zm; SHOW TABLES LIKE 'Monitors';"
      register: zm_db_check
      changed_when: false
      failed_when: false

    # zmupdate.pl -f is NOT the initial-schema-load tool despite being the
    # package's documented one-liner for this -- found live, it assumes
    # core tables (Config, etc.) already exist and fails outright on a
    # genuinely empty database ("Table 'zm.Config' doesn't exist"). The
    # real initial schema ships as a plain SQL file; zmupdate.pl is only
    # for version-to-version migrations on top of that.
    - name: Load ZoneMinder's initial database schema
      command: >
        mysql -u root zm -e "source /usr/share/zoneminder/db/zm_create.sql"
      when: "'Monitors' not in zm_db_check.stdout"

    # Safe/idempotent to run either way -- brings a freshly-loaded schema
    # up to whatever point releases this package version expects, same as
    # it would on a genuine upgrade.
    - name: Apply any pending ZoneMinder schema migrations
      command: zmupdate.pl -f
      when: "'Monitors' not in zm_db_check.stdout"

    # zm_create.sql seeds the default admin account with APIEnabled=0 --
    # a per-user flag, separate from ZM's global API toggle. Found live:
    # explains why logging in via the API worked (returned a token) but
    # every subsequent authenticated API call as that user was rejected
    # with "Insufficient Privileges" regardless of the account's other
    # (all-Edit) permissions. Can't fix this through the API itself
    # (circular -- it's disabled for exactly the account that would need
    # to call it), so it's a direct SQL UPDATE, the one place that's
    # actually the right tool rather than a workaround.
    - name: Enable API access for the admin account
      command: mysql -u root zm -e "UPDATE Users SET APIEnabled=1 WHERE Username='admin'"
      changed_when: false

    # MariaDB defaults to 127.0.0.1-only -- livecam (on dockerhost1) needs
    # to reach ZM's Sessions table remotely to resolve a session cookie to
    # a ZM username (see livecam's own README). Bound to this VM's own LAN
    # IP specifically, not 0.0.0.0, so it's not reachable from anywhere
    # broader than the internal network this VM is already only on.
    - name: Let MariaDB listen on the LAN interface
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: "bind-address = 192.168.1.85"
      notify: Restart MariaDB

    # Dedicated read-only account, not ZM's own root/app credentials --
    # scoped to exactly the one table livecam actually needs (Sessions, to
    # resolve who a forwarded session cookie belongs to), nothing else in
    # the zm database.
    - name: Create livecam's read-only DB user
      mysql_user:
        name: livecam_ro
        password: "{{ camera_secrets.livecam_db_password }}"
        host: "192.168.1.31"
        priv: "zm.Sessions:SELECT"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

    # Ships root:root 640 -- unreadable by www-data, which the zoneminder
    # service and zmpkg.pl both run as. Found live (service failed to
    # start: "configuration file found but is not readable"). Normally
    # fixed by the package's own postinst during an interactive install,
    # which a plain apt state:present never triggers.
    - name: Let www-data read ZoneMinder's config
      file:
        path: /etc/zm/zm.conf
        group: www-data

    - name: Add www-data to the video group (camera device/capture access)
      user:
        name: www-data
        groups: video
        append: yes

    - name: Enable required Apache modules for ZoneMinder
      command: "a2enmod {{ item }}"
      args:
        creates: "/etc/apache2/mods-enabled/{{ item }}.load"
      loop:
        - cgi
        - rewrite

    # ZoneMinder's package ships its Apache config under conf-available/,
    # not sites-available/ -- found live (a2ensite failed outright since
    # sites-available/zoneminder.conf doesn't exist; the package's actual
    # file is conf-available/zoneminder.conf, which needs a2enconf instead).
    - name: Enable ZoneMinder's Apache config
      command: a2enconf zoneminder
      args:
        creates: /etc/apache2/conf-enabled/zoneminder.conf
      notify: Restart Apache

    # Storage path needs no config here at all -- the footage disk is
    # mounted at ZM's own default events path near the top of this play,
    # so ZM's shipped default is already correct. (The previous
    # ZM_DIR_EVENTS approach that used to live here didn't work; see that
    # mount task's comment.) This only fixes ownership, since the mount
    # itself lands root-owned.
    - name: Ensure the events directory is owned by ZoneMinder's service user
      file:
        path: /var/cache/zoneminder/events
        owner: www-data
        group: www-data

    - name: Ensure ZoneMinder is running and enabled
      service:
        name: zoneminder
        state: started
        enabled: yes

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes

    # Handlers only fire at the end of the play by default -- the API
    # login task right below needs the newly-enabled zoneminder conf
    # already loaded, not queued behind everything else.
    - meta: flush_handlers

    # zmuser.pl doesn't exist in this ZM version (1.36.x) -- found live,
    # the package's own bin/ list has no such script anymore; user
    # management moved entirely to the web UI/API. zm_create.sql seeds a
    # single admin account with ZM's well-known default bcrypt hash for
    # the password "admin" (meant to be changed on first login).
    #
    # Direct SQL UPDATE, not the API's user-edit endpoint: spent real
    # effort chasing that path first (API login worked, but every
    # subsequent authenticated call as admin came back "Insufficient
    # Privileges" despite the account's System=Edit permission and
    # APIEnabled=1 both checking out against the controller's own source --
    # something deeper in ZM's ACL layer, not worth reverse-engineering
    # further for a one-time password set). ansible's password_hash filter
    # produces a standard bcrypt hash (passlib, "2b" prefix) -- the exact
    # format zm_create.sql's own seed row already uses, so this is setting
    # the same field the same way the app itself would, just via SQL
    # instead of the API. Idempotent: harmless to set the same value again
    # on every re-run.
    - name: Set ZoneMinder admin password
      command: >
        mysql -u root zm -e
        "UPDATE Users SET Password='{{ camera_secrets.zm_admin_password | password_hash('bcrypt', rounds=12) }}' WHERE Username='admin'"
      changed_when: false
      no_log: true

    # ZM's REST API needs API access enabled (ZM_OPT_USE_API, on by default
    # in recent packaged versions) -- verify against the installed version
    # if the login step below 401s unexpectedly.
    - name: Log in to ZoneMinder's API
      uri:
        url: "http://localhost/zm/api/index.php/host/login.json"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ zm_admin_user | default('admin') }}"
          pass: "{{ camera_secrets.zm_admin_password }}"
        status_code: 200
      register: zm_login
      no_log: true

    - name: Get existing monitors
      uri:
        url: "http://localhost/zm/api/index.php/monitors.json?token={{ zm_login.json.access_token }}"
        method: GET
        status_code: 200
      register: zm_existing_monitors

    # Function=Record (not Modect/Mocord): deliberately the lightest-CPU ZM
    # mode -- skips the motion-analysis daemon entirely, which is exactly
    # right given no motion/AI detection is wanted and the FX8200's CPU is
    # old.
    #
    # VideoWriter=2 ("Camera Passthrough", confirmed against this version's
    # own monitor.php) writes the camera's native H.264 straight to mp4 with
    # zero transcode, and SaveJPEGs=0 disables per-frame JPEG writing. Both
    # are load-bearing, not tuning: the package defaults (SaveJPEGs=3,
    # VideoWriter=0) are the legacy every-frame-as-a-JPEG mode, which was
    # left unset in the first version of this role and wrote 13GB across
    # 24,211 files in ~1 hour for 2 cameras -- ~312GB/day, versus the
    # GB/hour that passthrough actually costs. Passthrough is only offered
    # for Ffmpeg-type monitors, which is what Type below sets.
    #
    # Type: Ffmpeg, not Remote -- found live, tried Remote first (ZM's own
    # built-in RTSP/RTP parser) and it failed outright against these
    # cameras' SDP response ("No RTSP sources", zm_remote_camera_rtsp.cpp)
    # even though the exact same stream opens perfectly via plain ffprobe/
    # ffmpeg. Ffmpeg-type Monitors use libavformat under the hood (the
    # same thing ffprobe uses) instead of ZM's own RTSP implementation --
    # confirmed live, immediately connected at the camera's real ~20fps.
    # Also omitting Type entirely defaults to Local (a physical /dev/videoX
    # capture device, which doesn't exist on this VM) -- crash-looped with
    # "Can't find swscale format for palette 0" until Type was set at all.
    #
    # Ffmpeg-type Monitors take the whole source as one URL in Path, not
    # split Host/Port/Protocol/Method/User/Pass fields the way Remote-type
    # does -- urlencode both credential fields since Amcrest's default
    # password format (this fleet's included a literal '#') breaks the URL
    # otherwise.
    - name: Create a Monitor for each camera
      uri:
        url: "http://localhost/zm/api/index.php/monitors.json?token={{ zm_login.json.access_token }}"
        method: POST
        body_format: json
        body:
          Monitor:
            Name: "{{ item.name }}"
            Type: "Ffmpeg"
            Function: "Record"
            Path: "rtsp://{{ camera_secrets.username | urlencode }}:{{ camera_secrets.password | urlencode }}@{{ item.ip }}:554/cam/realmonitor?channel={{ item.channel | default(1) }}&subtype=0"
            Width: "{{ item.width | default(2960) }}"
            Height: "{{ item.height | default(1668) }}"
            SaveJPEGs: 0
            VideoWriter: 2
        status_code: [200, 201]
      loop: "{{ cameras }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in (zm_existing_monitors.json.monitors | default([]) | map(attribute='Monitor.Name') | list)
      no_log: true

    # The task above only fires for monitors that don't exist yet, so on
    # any already-provisioned host it never runs and the recording-mode
    # fields above would never be corrected. This catches that case --
    # cheap, idempotent, and the difference between GB/hour and 13GB/hour
    # of disk, so it's worth enforcing on every run rather than trusting
    # creation-time settings to have been right.
    - name: Enforce passthrough recording on existing monitors
      command: >
        mysql -u root zm -e
        "UPDATE Monitors SET SaveJPEGs=0, VideoWriter=2 WHERE SaveJPEGs != 0 OR VideoWriter != 2"
      register: zm_recording_mode_fix
      changed_when: false

  handlers:
    - name: Restart ZoneMinder
      service:
        name: zoneminder
        state: restarted

    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted

    - name: Restart Apache
      service:
        name: apache2
        state: restarted
