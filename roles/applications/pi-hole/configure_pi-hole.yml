# https://pi-hole.net/
# Be sure to give the pihole host a static IP address and register it with the DNS server in router configs
---
- name: Configure Pi-hole on Debian
  hosts: PiHole
  become: yes
  tasks:
    - name: Ensure /etc/pihole directory exists
      file:
        path: /etc/pihole
        state: directory
        owner: root
        group: root
        mode: '0755'

    # https://unix.stackexchange.com/questions/423715/install-pi-hole-without-user-interaction
    - name: Update setupVars.conf
      template:
        src: "templates/setupVars.conf.j2"
        dest: "/etc/pihole/setupVars.conf"
        owner: root
        group: root
        mode: '0644'

    # NOTE: The previously-pinned copy of this script (templates/basic-install.sh) hardcoded
    # the FTL binary download URL, which broke when upstream renamed the release asset in v6.7.
    # Fetching live avoids re-pinning against a moving upstream target.
    - name: Fetch current pi-hole install script
      get_url:
        url: https://raw.githubusercontent.com/pi-hole/pi-hole/master/automated%20install/basic-install.sh
        dest: "/etc/pihole/basic-install.sh"
        owner: root
        group: root
        mode: '0644'
        force: true

    - name: Apply pi-hole configuration
      shell: "bash /etc/pihole/basic-install.sh --unattended"
      changed_when: true
