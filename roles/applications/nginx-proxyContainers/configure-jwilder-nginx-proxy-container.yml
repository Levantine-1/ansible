---
- name: Pull and run nginx-proxy container
  hosts: VMWareDockerHosts
  gather_facts: yes
  become: yes

  vars_files:
    - ../../../vault.yml

  tasks:

    # The docker module documentation mainly focuses on getting information on a specific container
    # and it was difficult to find a way to just get a list of running containers. In any case, since this
    # just listing, it should still be declarative
    - name: Get running container names
      ansible.builtin.command: 'docker ps --format "\{\{.Names\}\} --filter status=running"'
      register: running_containers_raw
      changed_when: false

    - name: Pull nginx-proxy image
      docker_image:
        name: jwilder/nginx-proxy
        source: pull
        tag: latest
      register: image_pull

    # TLS on dockerhost1 exists so the LAN can serve HTTPS directly. Without
    # it only the AWS bastion terminated TLS, so any https:// request from
    # home resolved out to Oregon and was relayed back through WireGuard --
    # video going up the uplink and back down, billed as egress. It was also
    # why the recordings UI felt slow back when ZoneMinder served it: a
    # console page pulled 33 sub-resources, each round-tripping to AWS.
    #
    # Named after the bare domain on purpose: jwilder matches a wildcard
    # cert by that filename, so levantine.io.crt covers every *.levantine.io
    # vhost here -- livecam.levantine.io and livecam-lan.levantine.io alike
    # -- rather than needing a file per hostname.
    - name: Create the nginx-proxy certs directory
      file:
        path: /opt/nginx-certs
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Retrieve the levantine.io certificate from Vault
      set_fact:
        ssl_certs: "{{ lookup('hashi_vault', 'secret=kv/data/ssl_certs/levantine_io token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"
      no_log: true

    - name: Deploy the wildcard certificate for nginx-proxy
      copy:
        content: "{{ ssl_certs[item.key] }}"
        dest: "/opt/nginx-certs/levantine.io.{{ item.ext }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { key: fullchain, ext: crt }
        - { key: privkey, ext: key }
      loop_control:
        label: "levantine.io.{{ item.ext }}"
      no_log: true
      register: proxy_certs

    # NOTE: 2026-07-26 Splunk logging disabled -- HEC was never set up on the
    # rebuilt Splunk host post-migration (see ansible README). Containers use
    # Docker's default json-file logging until that's addressed. This matches
    # the same fix already applied in deployDockerImage.yml; this task hadn't
    # been updated to match, which caused container start to fail outright
    # ("connect: connection refused" to Splunk's HEC) on a from-scratch host.
    - name: Run nginx-proxy container
      docker_container:
        name: nginx-proxy
        image: jwilder/nginx-proxy:latest
        env:
          # Serve both HTTP and HTTPS without forcing a redirect between
          # them. jwilder's default once a cert exists is to 301 every HTTP
          # request to HTTPS, which is actively wrong in this topology: the
          # public path terminates TLS at the AWS bastion and reaches this
          # host over plain HTTP, so the redirect sent the client back
          # around the same loop -- Firefox reported "the page isn't
          # redirecting properly" for every app here.
          #
          # LAN clients still get TLS by requesting https directly; the
          # relay keeps working over http. The stricter alternative is to
          # have the relay pass X-Forwarded-Proto: https (which jwilder
          # honours) and keep the redirect, but that means editing the
          # bastion and vmwarebastion nginx configs -- a change to the path
          # every other app depends on, for no benefit here.
          HTTPS_METHOD: noredirect
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - "/var/run/docker.sock:/tmp/docker.sock:ro"
          - "/opt/nginx-certs:/etc/nginx/certs:ro"
        detach: yes
        restart_policy: unless-stopped
        container_default_behavior: no_defaults
      # Deliberately unconditional. This used to be gated on
      # `image_pull.changed or not running`, which had already been widened
      # once (from image_pull alone) because a host that had pulled the
      # image but had no container silently skipped instead of starting it.
      # The same class of gap bit again here: with the container already
      # running, a gate like that means changes to ports or volumes -- such
      # as adding 443 and the certs mount -- are never applied, because
      # nothing asks Docker to reconcile.
      #
      # docker_container is declarative and reports changed only when it
      # genuinely has to recreate, so letting it evaluate every run is both
      # correct and quiet. Verified idempotent on a second run, which
      # matters because a spurious recreate here cascades into restarting
      # every app container below.
      register: container_start

    - name: Restart nginx-proxy container if image was pulled
      docker_container:
        name: nginx-proxy
        state: restarted
      when: image_pull.changed and not container_start.changed
      register: container_restart

    - name: Restart running containers if nginx-proxy container was restarted
      docker_container:
        name: "{{ item }}"
        state: restarted
      loop: "{{ running_containers_raw.stdout_lines }}"
      when: container_restart.changed and item != 'nginx-proxy'
