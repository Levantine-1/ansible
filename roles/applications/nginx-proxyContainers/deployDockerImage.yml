---
- name: Deploy Docker Image
  hosts: VMWareDockerHosts
  gather_facts: true
  become: true

  # vars:
    # variable container_name is defined as an extra var

  vars_files:
    - ../../../vault.yml

  tasks:
    - name: Validate Supported Container
      debug:
        msg: "Checking to see if container is supported"
      failed_when: container_name == 'nginx-proxy' or container_name not in supported_containers

    - name: Set local registry image reference
      # Pulled from service's local registry (populated by
      # downloadDockerImage.yml) instead of fetched/copied as a tarball --
      # see the comment there for why. Reusing the tag downloadDockerImage.yml
      # just pushed (via hostvars, not a fresh ECR lookup) guarantees this
      # pulls exactly what was just built, not whatever happens to be
      # "latest" in ECR by the time this play runs.
      set_fact:
        local_registry_image: "service.internal.levantine.io:5000/{{ container_name }}:{{ hostvars['service.internal.levantine.io']['latest_image']['stdout'] }}"

    - name: Stop the old Docker container (if exists)
      docker_container:
        name: "{{ container_name }}"
        state: stopped
        timeout: 30
        container_default_behavior: no_defaults
      ignore_errors: yes

    - name: Pull Docker Image from local registry
      docker_image:
        name: "{{ local_registry_image }}"
        source: pull

    # Generic Vault -> env var injection, replacing the hardcoded
    # DATA_GATEWAY_API_KEY_PATH handling that used to live here (which its
    # own comment flagged as temporary). A container declares what it needs
    # in group_vars/VMWareDockerHosts:
    #
    #   vault_secrets:
    #     - path: kv/data/livecam/admin
    #       env:
    #         ZM_DB_PASSWORD: zm_db_password   # <ENV VAR>: <key in Vault>
    #
    # The field is `env`, not `keys`: in Jinja `item.keys` resolves to the
    # dict's own .keys method rather than a member called "keys", which
    # fails in a genuinely confusing way.
    #
    # Anything without a vault_secrets block is unaffected.
    - name: Start from the container's plain env_vars
      set_fact:
        env_vars: "{{ supported_containers[container_name]['env_vars'] | default({}) }}"

    - name: Resolve secrets from Vault and merge into env_vars
      set_fact:
        env_vars: >-
          {{ env_vars | combine(dict(
               item['env'].keys() | list
               | zip(item['env'].values() | list | map('extract', vault_data) | list)
             )) }}
      vars:
        vault_data: "{{ lookup('hashi_vault', 'secret=' + item['path'] + ' token=' + hashicorp_vault_token + ' url=' + hashicorp.vault.address) }}"
      loop: "{{ supported_containers[container_name]['vault_secrets'] | default([]) }}"
      loop_control:
        label: "{{ item['path'] }}"
      no_log: true

    # NOTE: 2026-07-26 Splunk logging disabled -- HEC was never set up on the
    # rebuilt Splunk host post-migration (see ansible README). Containers use
    # Docker's default json-file logging until that's addressed.
    # restart_policy: without it, a crashed container just stays dead until
    # someone notices and redeploys -- this is exactly how the `portfolio`
    # container ended up silently missing from dockerhost1 entirely,
    # causing a 502 on levantine.io that went unnoticed until the new
    # Alertmanager->Zammad pipeline caught it.
    # volumes is optional and omitted by every container except livecam,
    # which needs its per-user permission config mounted in. Kept as a
    # host bind mount rather than baked into the image so the permissions
    # can be edited and reviewed in git without a rebuild+redeploy cycle.
    - name: Run Docker Container
      docker_container:
        name: "{{ container_name }}"
        image: "{{ local_registry_image }}"
        env: "{{ env_vars }}"
        volumes: "{{ supported_containers[container_name]['volumes'] | default(omit) }}"
        restart_policy: unless-stopped

    - name: Prune Docker
      command: docker system prune -af