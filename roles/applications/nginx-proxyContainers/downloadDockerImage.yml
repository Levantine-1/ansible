---
# hosts: service, not localhost -- this needs a real docker/aws-cli/sudo
# environment. That was implicitly true when Jenkins ran ansible-playbook
# directly on its own host, but Semaphore executes ansible-playbook from
# inside its own minimal container, where "localhost" has none of that.
# deployDockerImage.yml pulls the resulting image from the local registry
# below rather than assuming it shares a filesystem with wherever
# ansible-playbook itself happens to run.
- name: Download Docker Image
  hosts: service
  gather_facts: true
  become: true

  vars_files:
    - ../../../vault.yml
  vars:
    # variable container_name is defined as an extra var
    account_id: "{{ aws.account_id }}"
    default_region: "{{ aws.default_region }}"
    aws_environment: # These will be filled in by the HashiCorp Vault lookup in this playbook
      AWS_ACCESS_KEY_ID: "{{ aws_creds.access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ aws_creds.secret_key }}"

  tasks:
    - name: Validate Supported Container
      debug:
        msg: "Checking to see if container is supported"
      failed_when: "container_name == 'nginx-proxy' or container_name not in hostvars[groups['VMWareDockerHosts'][0]]['supported_containers']"

    - name: Retrieve AWS Credentials from HashiCorp Vault
      # NOTE: The secret path is created in the main terraform repo when the user is created and key stored in vault at path below
      set_fact:
        aws_creds: "{{ lookup('hashi_vault', 'secret=kv/data/aws/iam_access_keys/terraform_{{ container_name }} token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

    - name: Log in to AWS ECR
      shell: "aws ecr get-login-password --region {{ default_region }} | docker login --username AWS --password-stdin {{ account_id }}.dkr.ecr.{{ default_region }}.amazonaws.com"
      environment: "{{ aws_environment }}"

    - name: Get the latest Docker image from ECR
      shell: "aws ecr describe-images --repository-name {{ container_name }} --query 'sort_by(imageDetails, &imagePushedAt) | [-1].imageTags[0]' --output text --region {{ default_region }}"
      environment: "{{ aws_environment }}"
      register: latest_image

    - name: Latest docker image
      debug:
        msg: "{{ latest_image.stdout }}"

    - name: Pull Docker Image from ECR
      shell: "docker pull {{ account_id }}.dkr.ecr.{{ default_region }}.amazonaws.com/{{ container_name }}:{{ latest_image.stdout }}"
      register: pulled_image

    - name: Docker Image Pulled
      debug:
        msg: "{{ pulled_image.stdout }}"

    # Moves the image to dockerhost1 via a local registry push/pull instead
    # of ansible's fetch+copy (which base64-encodes the whole file into a
    # single JSON blob over SSH -- fails outright on large images, confirmed
    # on processmining's ~400MB image). Mirrors the pattern already proven
    # in dataGateway/dataGatewayK8Configs.yml. Deleted and recreated every
    # run (same disk-consumption workaround documented there) since this
    # registry is purely a transit mechanism, not persistent storage.
    - name: Delete the local Docker image registry
      docker_container:
        name: registry
        state: absent

    - name: Recreate the local Docker image registry
      docker_container:
        name: registry
        image: registry:latest
        state: started
        restart_policy: always
        ports:
          - "5000:5000"
        env:
          REGISTRY_HTTP_ADDR: "0.0.0.0:5000"

    - name: Tag the Docker image for the local registry
      # localhost:5000, not the FQDN -- Docker trusts 127.0.0.0/8 registries
      # as insecure by default, so no daemon.json change is needed here for
      # the push half (dockerhost1's pull half does need one, see
      # installDocker.yml).
      command: "docker tag {{ account_id }}.dkr.ecr.{{ default_region }}.amazonaws.com/{{ container_name }}:{{ latest_image.stdout }} localhost:5000/{{ container_name }}:{{ latest_image.stdout }}"

    - name: Push the Docker image to the local registry
      command: "docker push localhost:5000/{{ container_name }}:{{ latest_image.stdout }}"

    - name: Prune Docker
      command: docker system prune -af
