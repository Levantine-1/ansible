---
# A single landing page on `service` (port 80/443) linking to every ops app
# running there, so nobody has to remember port numbers. Grafana/
# Prometheus/Alertmanager/chat get true subpath reverse-proxying (they
# natively support it); Semaphore/Zammad/OPNsense get direct-port/IP
# links on the same page instead, since their frontends don't support
# being served from a subpath cleanly.
#
# Also runs two small native Flask processes: a chat app (files/chat_app.py)
# talking to the fleet's Ollama instance on `incident-agent` for ad-hoc use,
# unrelated to the incident-triage pipeline that also uses that model; and
# (2026-08-24) an incident-agent status/controls app (files/incident_status_app.py)
# proxying to listener.py's /status and /toggles routes on incident-agent.
- name: Deploy ops dashboard
  hosts: service
  become: yes

  vars:
    ops_dashboard_title: "Homelab Ops"
    ops_dashboard_chat_port: 5055
    ops_dashboard_ollama_url: "http://incident-agent.internal.levantine.io:11434"
    ops_dashboard_ollama_model: "phi4-mini"
    ops_dashboard_incidents_port: 5056
    ops_dashboard_incident_agent_url: "http://incident-agent.internal.levantine.io:9098"
    ops_dashboard_timelapse_port: 5057

  tasks:
    - name: Install nginx
      package:
        name: nginx
        state: present

    - name: Install Python dependencies for the chat app
      # Just Flask -- everything else (the Ollama HTTP call) is stdlib
      # urllib, matching zammad_relay.py's dependency-light style. No venv,
      # same reasoning as opnsense's backup_opnsense_config.py: one small
      # dependency doesn't need the isolation overhead.
      pip:
        name: flask
        executable: pip3
        extra_args: --break-system-packages

    - name: Remove stock default site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Create ops-dashboard web root
      file:
        path: /var/www/ops-dashboard
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Deploy landing page
      template:
        src: templates/index.html.j2
        dest: /var/www/ops-dashboard/index.html
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Ensure the nginx snippets directory exists
      file:
        path: /etc/nginx/snippets
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the shared proxy-locations snippet
      # Not templated -- every value in this file is a hardcoded internal
      # address, none of it varies per environment, so a plain copy keeps it
      # simple. Included by both the HTTP and HTTPS server blocks in
      # ops-dashboard.conf.j2, so it exists exactly once.
      copy:
        src: files/ops-dashboard-locations.conf
        dest: /etc/nginx/snippets/ops-dashboard-locations.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    - name: Deploy ops-dashboard nginx site config
      template:
        src: templates/ops-dashboard.conf.j2
        dest: /etc/nginx/conf.d/ops-dashboard.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    - name: Ensure nginx is enabled and running
      systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Deploy chat app
      copy:
        src: files/chat_app.py
        dest: /usr/local/bin/ops_dashboard_chat.py
        owner: root
        group: root
        mode: "0755"
      register: chat_app_script

    - name: Deploy chat app environment file
      copy:
        dest: /etc/ops-dashboard-chat.env
        content: |
          OLLAMA_URL={{ ops_dashboard_ollama_url }}
          OLLAMA_MODEL={{ ops_dashboard_ollama_model }}
        owner: root
        group: root
        mode: "0644"
      register: chat_app_env

    - name: Deploy chat app systemd unit
      copy:
        dest: /etc/systemd/system/ops-dashboard-chat.service
        content: |
          [Unit]
          Description=Ops dashboard chat UI (talks to Ollama on incident-agent)
          After=network.target

          [Service]
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=/etc/ops-dashboard-chat.env
          ExecStart=/usr/bin/python3 /usr/local/bin/ops_dashboard_chat.py
          Restart=on-failure
          RestartSec=5
          User=www-data

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: chat_app_unit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: chat_app_unit.changed

    - name: Enable and start the chat app
      systemd:
        name: ops-dashboard-chat
        enabled: yes
        state: started

    - name: Restart chat app if its script or config changed
      systemd:
        name: ops-dashboard-chat
        state: restarted
      when: chat_app_script.changed or chat_app_env.changed or chat_app_unit.changed

    - name: Deploy incident-agent status app
      copy:
        src: files/incident_status_app.py
        dest: /usr/local/bin/ops_dashboard_incidents.py
        owner: root
        group: root
        mode: "0755"
      register: incidents_app_script

    - name: Deploy incident-agent status app environment file
      copy:
        dest: /etc/ops-dashboard-incidents.env
        content: |
          INCIDENT_AGENT_URL={{ ops_dashboard_incident_agent_url }}
        owner: root
        group: root
        mode: "0644"
      register: incidents_app_env

    - name: Deploy incident-agent status app systemd unit
      copy:
        dest: /etc/systemd/system/ops-dashboard-incidents.service
        content: |
          [Unit]
          Description=Ops dashboard incident-agent status + controls
          After=network.target

          [Service]
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=/etc/ops-dashboard-incidents.env
          ExecStart=/usr/bin/python3 /usr/local/bin/ops_dashboard_incidents.py
          Restart=on-failure
          RestartSec=5
          User=www-data

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: incidents_app_unit

    - name: Reload systemd daemon (incident-agent status app)
      systemd:
        daemon_reload: yes
      when: incidents_app_unit.changed

    - name: Enable and start the incident-agent status app
      systemd:
        name: ops-dashboard-incidents
        enabled: yes
        state: started

    - name: Restart incident-agent status app if its script or config changed
      systemd:
        name: ops-dashboard-incidents
        state: restarted
      when: incidents_app_script.changed or incidents_app_env.changed or incidents_app_unit.changed

    # Timelapse settings + review + /metrics (2026-10-22). The capture side
    # is roles/applications/timelapse; this is only its UI. Runs as
    # www-data like the others: it reads the archive (world-readable) and
    # writes nothing but /srv/timelapse/.config, which that role creates
    # owned by www-data.
    - name: Deploy timelapse app
      copy:
        src: files/timelapse_app.py
        dest: /usr/local/bin/ops_dashboard_timelapse.py
        owner: root
        group: root
        mode: "0755"
      register: timelapse_app_script

    - name: Deploy timelapse app systemd unit
      copy:
        dest: /etc/systemd/system/ops-dashboard-timelapse.service
        content: |
          [Unit]
          Description=Ops dashboard timelapse settings, review and metrics
          After=network.target

          [Service]
          Environment=PYTHONUNBUFFERED=1
          Environment=PORT={{ ops_dashboard_timelapse_port }}
          Environment=TIMELAPSE_DATA=/srv/timelapse
          Environment=CAMERAS_FILE=/etc/timelapse/cameras.json
          ExecStart=/usr/bin/python3 /usr/local/bin/ops_dashboard_timelapse.py
          Restart=on-failure
          RestartSec=5
          User=www-data

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: timelapse_app_unit

    - name: Reload systemd daemon (timelapse app)
      systemd:
        daemon_reload: yes
      when: timelapse_app_unit.changed

    - name: Enable and start the timelapse app
      systemd:
        name: ops-dashboard-timelapse
        enabled: yes
        state: started

    - name: Restart timelapse app if its script or unit changed
      systemd:
        name: ops-dashboard-timelapse
        state: restarted
      when: timelapse_app_script.changed or timelapse_app_unit.changed

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
