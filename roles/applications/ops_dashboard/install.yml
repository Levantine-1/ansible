---
# A single landing page on `service` (port 80/443) linking to every ops app
# running there, so nobody has to remember port numbers. Grafana/
# Prometheus/Alertmanager/chat get true subpath reverse-proxying (they
# natively support it); Semaphore/Zammad/OPNsense get direct-port/IP
# links on the same page instead, since their frontends don't support
# being served from a subpath cleanly.
#
# Also runs two small native Flask processes: a chat app (files/chat_app.py)
# talking to the fleet's Ollama instance on `incident-agent` for ad-hoc use,
# unrelated to the incident-triage pipeline that also uses that model; and
# (2026-08-24) an incident-agent status/controls app (files/incident_status_app.py)
# proxying to listener.py's /status and /toggles routes on incident-agent.
- name: Deploy ops dashboard
  hosts: service
  become: yes

  vars:
    ops_dashboard_title: "Homelab Ops"
    ops_dashboard_chat_port: 5055
    ops_dashboard_ollama_url: "http://incident-agent.internal.levantine.io:11434"
    ops_dashboard_ollama_model: "phi4-mini"
    ops_dashboard_incidents_port: 5056
    ops_dashboard_incident_agent_url: "http://incident-agent.internal.levantine.io:9098"
    ops_dashboard_timelapse_port: 5057
    # Apps linked directly (not proxied under a path) from the dashboard.
    # port: the public port, owned by nginx and answering HTTP and HTTPS
    # (ops-dashboard.conf.j2). upstream_port: where the app itself listens,
    # loopback only -- must match roles/applications/{semaphore,zammad}.
    # alias_port: the interim TLS-only port from 2026-11-09, kept so links
    # handed out then still work.
    # autologin: how home-LAN visitors skip the login (see "No-login access"
    # in ops-dashboard.conf.j2). sso_upstream_port: Zammad's Rails server,
    # published on loopback by roles/applications/zammad, used only for
    # /auth/sso (Zammad's own nginx blanks the SSO header).
    ops_dashboard_tls_direct_apps:
      - { name: "Semaphore", desc: "Ansible job runner", port: 3000, upstream_port: 13000, alias_port: 3443, autologin: semaphore_token }
      - { name: "Zammad", desc: "Ticketing", port: 8080, upstream_port: 18080, alias_port: 8443, autologin: zammad_sso, sso_upstream_port: 18081 }

    # No-login access (2026-11-10): who is signed in automatically, as whom.
    # Only the home LAN -- not the fleet network (192.168.1.0/24, where
    # machine clients bring their own credentials) and not wg0 (the AWS
    # bastion, 10.0.0.1), so a compromised bastion doesn't inherit admin on
    # Semaphore, i.e. root across the fleet.
    ops_dashboard_autologin_networks:
      - 10.69.69.0/24
    # Hostnames (and Origins) that count as this host. Anything else gets
    # no credentials: that is what defeats DNS rebinding, where an
    # attacker's own hostname resolves to 10.69.69.50.
    ops_dashboard_own_hosts:
      - service.levantine.io
      - service.internal.levantine.io
      - service
      - 10.69.69.50
    ops_dashboard_zammad_autologin_user: human-admin@levantine.io
    ops_dashboard_semaphore_autologin_user: admin
    ops_dashboard_grafana_autologin_user: admin
    ops_dashboard_semaphore_token_file: /etc/nginx/ops-secrets/semaphore-token.conf

  tasks:
    - name: Install nginx
      package:
        name: nginx
        state: present

    - name: Install Python dependencies for the chat app
      # Just Flask -- everything else (the Ollama HTTP call) is stdlib
      # urllib, matching zammad_relay.py's dependency-light style. No venv,
      # same reasoning as opnsense's backup_opnsense_config.py: one small
      # dependency doesn't need the isolation overhead.
      pip:
        name: flask
        executable: pip3
        extra_args: --break-system-packages

    - name: Remove stock default site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Create ops-dashboard web root
      file:
        path: /var/www/ops-dashboard
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Deploy landing page
      template:
        src: templates/index.html.j2
        dest: /var/www/ops-dashboard/index.html
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Ensure the nginx snippets directory exists
      file:
        path: /etc/nginx/snippets
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the shared proxy-locations snippet
      # Not templated -- every value in this file is a hardcoded internal
      # address, none of it varies per environment, so a plain copy keeps it
      # simple. Included by both the HTTP and HTTPS server blocks in
      # ops-dashboard.conf.j2, so it exists exactly once.
      copy:
        src: files/ops-dashboard-locations.conf
        dest: /etc/nginx/snippets/ops-dashboard-locations.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    # Semaphore has no trusted-header login, so LAN no-login access works by
    # nginx attaching an API token for the admin user. The token lives only
    # in this root-only include file; it is minted (and re-minted if it stops
    # working) from the admin password in Vault. Best-effort: if Semaphore is
    # down (e.g. mid-DR) the play carries on and LAN visitors simply see
    # Semaphore's normal login until the next run.
    - name: Create the nginx secrets directory
      file:
        path: /etc/nginx/ops-secrets
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Read the current Semaphore autologin token
      slurp:
        src: "{{ ops_dashboard_semaphore_token_file }}"
      register: semaphore_token_file
      failed_when: false
      no_log: true

    - name: Extract the current Semaphore autologin token
      set_fact:
        semaphore_autologin_token: >-
          {{ ((semaphore_token_file.content | default('') | b64decode)
              | regex_search('Bearer ([^"]+)"', '\1') or ['']) | first }}
      no_log: true

    - name: Mint a Semaphore autologin token if there is none or it stopped working
      block:
        - name: Check the current Semaphore autologin token
          uri:
            url: http://127.0.0.1:13000/api/user
            headers:
              Authorization: "Bearer {{ semaphore_autologin_token }}"
            status_code: [200, 401]
          register: semaphore_token_check
          when: semaphore_autologin_token != ''
          no_log: true

        - name: Retrieve Semaphore admin credentials from HashiCorp Vault
          set_fact:
            semaphore_secrets: "{{ lookup('hashi_vault', 'secret=kv/data/semaphore/admin token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"
          when: semaphore_autologin_token == '' or semaphore_token_check.status != 200
          no_log: true

        - name: Log in to Semaphore as the autologin user
          uri:
            url: http://127.0.0.1:13000/api/auth/login
            method: POST
            body_format: json
            body:
              auth: "{{ ops_dashboard_semaphore_autologin_user }}"
              password: "{{ semaphore_secrets.admin_password }}"
            status_code: [200, 204]
          register: semaphore_login
          when: semaphore_secrets is defined
          no_log: true

        - name: Create a Semaphore API token
          uri:
            url: http://127.0.0.1:13000/api/user/tokens
            method: POST
            headers:
              Cookie: "{{ semaphore_login.cookies_string }}"
            status_code: [200, 201]
          register: semaphore_new_token
          when: semaphore_secrets is defined
          no_log: true

        - name: Use the new Semaphore token
          set_fact:
            semaphore_autologin_token: "{{ semaphore_new_token.json.id }}"
          when: semaphore_secrets is defined
          no_log: true
      rescue:
        - name: Warn that Semaphore autologin could not be set up
          debug:
            msg: >-
              Could not validate or mint a Semaphore API token (is Semaphore up
              on 127.0.0.1:13000?). Keeping whatever token was there; LAN
              visitors get Semaphore's normal login until this play runs again.

    - name: Write the Semaphore autologin token for nginx
      copy:
        dest: "{{ ops_dashboard_semaphore_token_file }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by ansible: roles/applications/ops_dashboard/install.yml
          # Defines $ops_semaphore_token for ops-dashboard.conf. Secret.
          map $ops_autologin $ops_semaphore_token {
              1       "{{ ('Bearer ' ~ semaphore_autologin_token) if semaphore_autologin_token else '' }}";
              default "";
          }
      notify: reload nginx
      no_log: true

    - name: Deploy ops-dashboard nginx site config
      template:
        src: templates/ops-dashboard.conf.j2
        dest: /etc/nginx/conf.d/ops-dashboard.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload nginx

    - name: Ensure nginx is enabled and running
      systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Deploy chat app
      copy:
        src: files/chat_app.py
        dest: /usr/local/bin/ops_dashboard_chat.py
        owner: root
        group: root
        mode: "0755"
      register: chat_app_script

    - name: Deploy chat app environment file
      copy:
        dest: /etc/ops-dashboard-chat.env
        content: |
          OLLAMA_URL={{ ops_dashboard_ollama_url }}
          OLLAMA_MODEL={{ ops_dashboard_ollama_model }}
        owner: root
        group: root
        mode: "0644"
      register: chat_app_env

    - name: Deploy chat app systemd unit
      copy:
        dest: /etc/systemd/system/ops-dashboard-chat.service
        content: |
          [Unit]
          Description=Ops dashboard chat UI (talks to Ollama on incident-agent)
          After=network.target

          [Service]
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=/etc/ops-dashboard-chat.env
          ExecStart=/usr/bin/python3 /usr/local/bin/ops_dashboard_chat.py
          Restart=on-failure
          RestartSec=5
          User=www-data

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: chat_app_unit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: chat_app_unit.changed

    - name: Enable and start the chat app
      systemd:
        name: ops-dashboard-chat
        enabled: yes
        state: started

    - name: Restart chat app if its script or config changed
      systemd:
        name: ops-dashboard-chat
        state: restarted
      when: chat_app_script.changed or chat_app_env.changed or chat_app_unit.changed

    - name: Deploy incident-agent status app
      copy:
        src: files/incident_status_app.py
        dest: /usr/local/bin/ops_dashboard_incidents.py
        owner: root
        group: root
        mode: "0755"
      register: incidents_app_script

    - name: Deploy incident-agent status app environment file
      copy:
        dest: /etc/ops-dashboard-incidents.env
        content: |
          INCIDENT_AGENT_URL={{ ops_dashboard_incident_agent_url }}
        owner: root
        group: root
        mode: "0644"
      register: incidents_app_env

    - name: Deploy incident-agent status app systemd unit
      copy:
        dest: /etc/systemd/system/ops-dashboard-incidents.service
        content: |
          [Unit]
          Description=Ops dashboard incident-agent status + controls
          After=network.target

          [Service]
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=/etc/ops-dashboard-incidents.env
          ExecStart=/usr/bin/python3 /usr/local/bin/ops_dashboard_incidents.py
          Restart=on-failure
          RestartSec=5
          User=www-data

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: incidents_app_unit

    - name: Reload systemd daemon (incident-agent status app)
      systemd:
        daemon_reload: yes
      when: incidents_app_unit.changed

    - name: Enable and start the incident-agent status app
      systemd:
        name: ops-dashboard-incidents
        enabled: yes
        state: started

    - name: Restart incident-agent status app if its script or config changed
      systemd:
        name: ops-dashboard-incidents
        state: restarted
      when: incidents_app_script.changed or incidents_app_env.changed or incidents_app_unit.changed

    # Timelapse settings + review + /metrics (2026-10-22). The capture side
    # is roles/applications/timelapse; this is only its UI. Runs as
    # www-data like the others: it reads the archive (world-readable) and
    # writes nothing but /srv/timelapse/.config, which that role creates
    # owned by www-data.
    - name: Deploy timelapse app
      copy:
        src: files/timelapse_app.py
        dest: /usr/local/bin/ops_dashboard_timelapse.py
        owner: root
        group: root
        mode: "0755"
      register: timelapse_app_script

    - name: Deploy timelapse app systemd unit
      copy:
        dest: /etc/systemd/system/ops-dashboard-timelapse.service
        content: |
          [Unit]
          Description=Ops dashboard timelapse settings, review and metrics
          After=network.target

          [Service]
          Environment=PYTHONUNBUFFERED=1
          Environment=PORT={{ ops_dashboard_timelapse_port }}
          Environment=TIMELAPSE_DATA=/srv/timelapse
          Environment=CAMERAS_FILE=/etc/timelapse/cameras.json
          ExecStart=/usr/bin/python3 /usr/local/bin/ops_dashboard_timelapse.py
          Restart=on-failure
          RestartSec=5
          User=www-data

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: timelapse_app_unit

    - name: Reload systemd daemon (timelapse app)
      systemd:
        daemon_reload: yes
      when: timelapse_app_unit.changed

    - name: Enable and start the timelapse app
      systemd:
        name: ops-dashboard-timelapse
        enabled: yes
        state: started

    - name: Restart timelapse app if its script or unit changed
      systemd:
        name: ops-dashboard-timelapse
        state: restarted
      when: timelapse_app_script.changed or timelapse_app_unit.changed

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
