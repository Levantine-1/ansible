apiVersion: 1

# The original provisioning (before this file pinned an explicit uid)
# left a "Prometheus" datasource in Grafana's DB with an auto-generated
# uid. Re-provisioning with uid: prometheus without this directive
# crash-looped Grafana on startup ("Datasource provisioning error: data
# source not found") trying to reconcile the identity change in place --
# deleteDatasources forces a clean delete-then-recreate instead.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # /prometheus, not just :9090 -- Prometheus runs with
    # --web.route-prefix=/prometheus/ (added for the ops-dashboard
    # subpath proxy), which prefixes ALL of its HTTP routes, including
    # the query API, not just the browser UI. Broke Grafana's own
    # datasource connection until caught here.
    url: http://localhost:9090/prometheus
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://localhost:3100
    editable: false
