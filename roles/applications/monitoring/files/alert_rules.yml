groups:
  - name: fleet
    rules:
      # for: 10m -> back to 5m (2026-08-24, same day as the 10m bump). The
      # noise-reduction case for 10m was real, but the calculus changed the
      # same day: the local tier gained real action authority (start/stop/
      # restart, not just classify-or-escalate) plus a routine-vs-disaster
      # gate that avoids wasting Claude calls on unfixable-by-anyone
      # failures -- so a faster-firing alert now more often gets handled
      # cheaply and quickly by the local tier instead of sitting noisily.
      # 5m matches ProbeFailed and is back to being the fastest-firing rule
      # in this file, by design -- detection speed matters again now that
      # something competent and cheap responds to it.
      - alert: InstanceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ({{ $labels.job }}) has been down for 5+ minutes"

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} CPU usage above 90% for 10+ minutes"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} memory usage above 90% for 10+ minutes"

      # Two NVR mountpoints are excluded deliberately, both because they run
      # near-full BY DESIGN and would otherwise pin this alert on forever.
      #
      # /media/frigate is the guest recording disk: Frigate is configured to
      # fill it and age footage out, so near-full is the intended steady
      # state, not a fault.
      #
      # /mnt/nvr-hdd is the hypervisor filesystem holding that VM's disk
      # image. It sits at ~8% free in normal operation and cannot be expected
      # to recover: the image is sparse and never shrinks while the VM disk
      # is discard=ignore, so committed space is not reclaimable in place.
      # Left in this rule it fired continuously (2026-09-01) at a severity
      # that said "warning" for ten days while the real problem -- the disk
      # trending to exhaustion -- was invisible.
      #
      # Both have dedicated rules below that express what actually means
      # something for each. An alert that is always on is an alert nobody
      # reads, which is precisely how this one was missed.
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint!~"/media/frigate|/mnt/nvr-hdd"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", mountpoint!~"/media/frigate|/mnt/nvr-hdd"}) * 100 < 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} filesystem {{ $labels.mountpoint }} below 10% free space"

      # The NVR disk gets its own, much lower threshold. Frigate's own
      # emergency cleanup keeps roughly an hour of space free, so crossing
      # below 2% means retention has actually stopped working rather than
      # that the disk is doing its job. Worth alerting on precisely because
      # silent retention failure is invisible otherwise.
      - alert: NVRRetentionFailing
        expr: (node_filesystem_avail_bytes{mountpoint="/media/frigate"} / node_filesystem_size_bytes{mountpoint="/media/frigate"}) * 100 < 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} NVR disk below 2% free -- Frigate retention is not keeping up"

      # The two rules above both watch the GUEST. Neither can see the
      # constraint that actually bites first: the hypervisor filesystem
      # holding the VM's disk image.
      #
      # 2026-09-01: the NVR filled for ten days straight and the only thing
      # that fired was a generic warning-level DiskSpaceLow on fx8200. The
      # guest had 222GiB free while fx8200's /mnt/nvr-hdd had 156GiB -- and
      # the guest's virtual disk (1900GiB) is larger than the filesystem
      # backing it (1832GiB), so the guest can allocate space the host cannot
      # supply. When the host fills, QEMU cannot extend the sparse image and
      # the guest takes I/O errors mid-write -- far worse than deleting old
      # footage. Frigate's own emergency cleanup cannot prevent it: it fires
      # below one hour of free space, and it measures the guest.
      #
      # This is the rule that would have caught it, days early. A percentage
      # threshold could not: the host sits at ~8% free in normal operation
      # (the raw image is sparse and never shrinks without discard, so the
      # committed space is not recoverable in place), which means any
      # threshold high enough to give useful warning would fire permanently.
      # The trend is what distinguishes "full by design" from "filling".
      - alert: NVRHostDiskFilling
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/mnt/nvr-hdd"}[6h], 24 * 3600) < 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} /mnt/nvr-hdd is on track to run out within 24h"
          description: >-
            The hypervisor filesystem backing the Frigate VM is trending toward
            exhaustion. In steady state this should be flat, because Frigate
            deletes as much as it writes. A sustained decline means retention is
            not keeping up: check retain_days x measured GB/day against THIS
            filesystem, not the guest's. Adding a camera without re-deriving
            that number is what caused the 2026-09-01 incident.

      # Absolute floor, deliberately set BELOW the ~8% steady state so it
      # means "actually out of room" rather than "normal". Kept as a backstop
      # in case the disk fills faster than the 6h trend window can react to.
      - alert: NVRHostDiskCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/mnt/nvr-hdd"} / node_filesystem_size_bytes{mountpoint="/mnt/nvr-hdd"}) * 100 < 4
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} /mnt/nvr-hdd below 4% free -- Frigate writes are about to fail"
          description: >-
            At this point QEMU may be unable to extend the VM's sparse disk
            image, which surfaces inside the guest as I/O errors rather than as
            a disk-full condition Frigate can handle. Reduce frigate_retain_days
            immediately.

      # See InstanceDown's comment above -- same revert, same reason.
      - alert: ProbeFailed
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Uptime probe failing for {{ $labels.instance }}"

      # --- Proxmox hardware health (SMART, NVMe wear, chip temperature) ---
      # Deployed via roles/os_configs/hardware_monitoring.yml, scraped as
      # job=smartctl_exporter (SMART/NVMe) and job=node_exporter's already-
      # default hwmon collector (temperature -- no new deployment needed
      # for that half at all).

      # smartctl_device_smart_status is smartctl's own overall PASS/FAIL
      # self-assessment (1=PASSED, 0=FAILED; confirmed live -- the metric
      # name is NOT "..._status_ok" as first guessed, corrected against a
      # real scrape before this rule was trusted) -- the same verdict
      # `smartctl -H` gives interactively, and the single highest-signal
      # disk metric there is: a drive reporting FAILED has already decided
      # it's unhealthy, no "wait and see" tier for it.
      - alert: SMARTDiskFailing
        expr: smartctl_device_smart_status == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} disk {{ $labels.device }} FAILED its SMART self-check"

      # Reallocated/pending sectors are the classic early ATA warning signs.
      # Non-zero doesn't mean imminent failure (a few over years of normal
      # wear is unremarkable) -- this is a heads-up to watch the trend, well
      # before the overall-health verdict above would ever trip.
      # Deliberately `warning`, not `critical`.
      #
      # attribute_value_type="raw" is required, not optional: this metric
      # also publishes the SAME attribute_name at value_type="value" and
      # "worst" (the normalized 0-253 health score, where higher is
      # generally better) and "thresh" (the failure threshold) -- confirmed
      # live these commonly sit around 100-200 on a perfectly healthy
      # drive. Without this filter the rule would match all four variants
      # and fire on nearly every drive immediately, since the normalized
      # score being "> 0" is the ordinary healthy case, not a fault.
      # 2026-09-03: was a plain nonzero check (`> 0`), which fired on any
      # static historical reallocation count, not just a new one -- confirmed
      # live as a real, costly bug: fx8200's /dev/sda (a Crucial MX300 SSD)
      # reallocated 12 blocks at some point in the past and has been static
      # ever since (PASSED health, 92% lifetime remaining, ~1900 spare
      # blocks), yet the old rule re-fired every 4-5 hours on the identical
      # unchanged value -- 7 tickets in 2 days (#16132-#16139), each an
      # independent local-model classification plus a full paid Claude
      # investigation to re-derive the same "this is benign" conclusion
      # Claude had already reached 6 times before. Its own RCA recommended
      # this exact fix in all 7.
      #
      # increase() over a day catches a GENUINE new reallocation on any
      # device type (a real degrading HDD or a real newly-failing SSD)
      # while staying silent on an old, static count -- better than
      # excluding SSDs by rotation_rate, which would blind the rule to a
      # real SSD failure instead of just this false-positive pattern.
      - alert: SMARTReallocatedSectorsPresent
        expr: increase(smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Reallocated_Event_Count|Current_Pending_Sector", attribute_value_type="raw"}[24h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} disk {{ $labels.device }} {{ $labels.attribute_name }} increased in the last 24h"

      # NVMe wear is a monotonic 0-100 counter, not pass/fail, so it needs
      # its own threshold. Anchor point: 3800xt's NVMe drive is confirmed at
      # 49% used RIGHT NOW under ordinary operation (2026-09-02), so the
      # warning tier needs real margin above that or it fires on day one
      # against perfectly healthy hardware.
      - alert: NVMeWearLevelHigh
        expr: smartctl_device_percentage_used > 80
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} NVMe {{ $labels.device }} at {{ $value }}% rated wear"

      - alert: NVMeWearLevelCritical
        expr: smartctl_device_percentage_used > 95
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} NVMe {{ $labels.device }} at {{ $value }}% rated wear -- replace soon"

      # media_errors counts actual uncorrectable data errors the controller
      # has hit -- unlike wear level (an expected slow trend), this should
      # stay zero for a drive's entire life. Any increase means data was
      # already at risk, not merely that the drive is aging.
      - alert: NVMeMediaErrors
        expr: smartctl_device_media_errors > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} NVMe {{ $labels.device }} reports {{ $value }} media error(s)"

      # Compares each sensor's live reading against ITS OWN vendor-specified
      # ceiling (node_hwmon_temp_max_celsius, already published per-chip by
      # node_exporter's default hwmon collector) rather than one hardcoded
      # number across fx8200's FX-8320 and 3800xt's Ryzen, which have very
      # different normal operating ranges.
      #
      # The (10, 200) bound on the vendor threshold itself is deliberate, not
      # decorative -- confirmed live on real hardware to matter in more than
      # one way:
      #   - NVMe's two auxiliary temp sensors (not the main Composite one)
      #     publish node_hwmon_temp_max_celsius = 65261.85 -- an obviously
      #     uninitialized sentinel value, not a real threshold.
      #   - The Super I/O chip enabled for fan monitoring (nct6775/it87,
      #     see hardware_monitoring.yml) publishes an auxiliary/unpopulated
      #     temp header at 113-114C with max_celsius = 0 -- a floating
      #     sensor input with no configured threshold, not a real 0C max.
      #   - fx8200's it8620 chip publishes max_celsius = 127 for two
      #     sensors -- it87's well-known default/unconfigured value (the
      #     BIOS never set a real limit), not a genuine 127C ceiling. This
      #     one sits comfortably inside a plain (10, 200) bound, so it is
      #     excluded by exact value instead.
      # None of these are real vendor limits, and dividing by them would
      # either silently never fire (65261), produce +Inf and fire
      # constantly (0), or fire falsely the first time that sensor's zone
      # runs warm (127, since 90% of a fake 127C is only ~114C) -- all
      # three observed directly while building this rule. Bounding the
      # threshold to a plausible range, plus excluding this one known
      # sentinel, is generic across chips and needs no per-sensor allowlist
      # (`temp1` means a different thing on different chips).
      - alert: HighChipTemperature
        expr: |
          (node_hwmon_temp_celsius / on (instance, chip, sensor) node_hwmon_temp_max_celsius > 0.9)
          and on (instance, chip, sensor) (node_hwmon_temp_max_celsius > 10)
          and on (instance, chip, sensor) (node_hwmon_temp_max_celsius < 200)
          and on (instance, chip, sensor) (node_hwmon_temp_max_celsius != 127)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} sensor {{ $labels.sensor }} ({{ $labels.chip }}) above 90% of its rated max temperature"

      - alert: CriticalChipTemperature
        expr: |
          (node_hwmon_temp_celsius / on (instance, chip, sensor) node_hwmon_temp_crit_celsius > 0.95)
          and on (instance, chip, sensor) (node_hwmon_temp_crit_celsius > 10)
          and on (instance, chip, sensor) (node_hwmon_temp_crit_celsius < 200)
          and on (instance, chip, sensor) (node_hwmon_temp_crit_celsius != 127)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} sensor {{ $labels.sensor }} ({{ $labels.chip }}) above 95% of its rated critical temperature"
          description: >-
            This is the chip manufacturer's own critical threshold, not an
            arbitrary number -- treat it as "about to throttle or shut down."

      # Fan detection succeeded on both hosts (2026-09-02): 3800xt's
      # platform_nct6775_656/nct6792 exposes fan1-5, fx8200's
      # platform_it87_552/it8620 exposes fan1-3 -- node_hwmon_fan_rpm is a
      # real, confirmed metric name, not a guess.
      #
      # NOT a plain `== 0` check, deliberately: fan4/fan5 on 3800xt and
      # fan3 on fx8200 report a PERMANENT 0 RPM -- these are Super I/O
      # headers with nothing physically connected, not stopped fans, and a
      # blanket zero-check would fire immediately and forever on them
      # (exactly the always-on-alert-nobody-reads failure this file's
      # DiskSpaceLow/NVR rules above already learned the hard way). Instead
      # this only fires on a real STOP TRANSITION: a fan reporting 0 now
      # that was genuinely spinning (>0) an hour ago. An always-unpopulated
      # header never satisfies the `offset 1h` half and so never matches,
      # with no need to hardcode which fan numbers "don't count" per host
      # -- which would silently stop working the day someone actually
      # plugs a fan into one of those headers.
      - alert: FanStopped
        expr: node_hwmon_fan_rpm == 0 and (node_hwmon_fan_rpm offset 1h) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} fan {{ $labels.sensor }} ({{ $labels.chip }}) stopped -- was spinning an hour ago, now 0 RPM"
