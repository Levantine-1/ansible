---
# Prometheus + Grafana + Alertmanager + Loki + Blackbox Exporter -- the
# monitoring/logging stack, replacing Splunk and the earlier Beszel/Uptime
# Kuma plan (needed custom app metrics, log tracking, and game-server
# uptime probing that Beszel can't do). Runs on `service` alongside the
# rest of the ops stack. All containers use host networking so they can
# reach fleet hosts by hostname via service's own /etc/hosts, and so
# node_exporter/cAdvisor (deployed separately, fleet-wide) don't need any
# extra Docker network plumbing to be scraped.
- name: Deploy monitoring stack
  hosts: service
  become: yes

  tasks:
    - name: Retrieve monitoring secrets from HashiCorp Vault
      set_fact:
        monitoring_secrets: "{{ lookup('hashi_vault', 'secret=kv/data/monitoring/admin token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

    - name: Retrieve Zammad secrets from HashiCorp Vault
      set_fact:
        zammad_secrets: "{{ lookup('hashi_vault', 'secret=kv/data/zammad/admin token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

    - name: Create /opt/monitoring directory
      file:
        path: /opt/monitoring
        state: directory
        owner: automation
        group: automation
        mode: "0750"

    - name: Deploy static config files
      copy:
        src: "files/{{ item }}"
        dest: "/opt/monitoring/{{ item }}"
        owner: automation
        group: automation
        mode: "0644"
      loop:
        - alert_rules.yml
        - blackbox.yml
        - loki-config.yml
        - grafana-datasources.yml
        - grafana-dashboards-provider.yml
      register: static_configs

    - name: Create Grafana dashboards directory
      file:
        path: /opt/monitoring/dashboards
        state: directory
        owner: automation
        group: automation
        mode: "0755"

    - name: Deploy Grafana dashboard JSON files
      copy:
        src: "files/dashboards/{{ item }}"
        dest: "/opt/monitoring/dashboards/{{ item }}"
        owner: automation
        group: automation
        mode: "0644"
      loop:
        - fleet-overview.json
        - host-detail.json
      register: dashboard_files

    - name: Deploy alertmanager.yml (templated to point at zammad-relay)
      template:
        src: templates/alertmanager.yml.j2
        dest: /opt/monitoring/alertmanager.yml
        owner: automation
        group: automation
        mode: "0644"
      register: alertmanager_config

    - name: Deploy prometheus.yml (templated scrape targets)
      template:
        src: templates/prometheus.yml.j2
        dest: /opt/monitoring/prometheus.yml
        owner: automation
        group: automation
        mode: "0644"
      register: prometheus_config

    - name: Deploy docker-compose.yml
      # 0640 not 0644 like the other configs above: this file has the
      # Grafana admin password interpolated directly into it (env var
      # passed to the container, not a bind-mounted file the container
      # process needs to read itself, so it doesn't need to be world-
      # readable the way the bind-mounted configs above do).
      template:
        src: templates/docker-compose.yml.j2
        dest: /opt/monitoring/docker-compose.yml
        owner: automation
        group: automation
        mode: "0640"

    - name: Pull monitoring stack images
      command: docker compose pull
      args:
        chdir: /opt/monitoring

    - name: Start monitoring stack via docker compose
      command: docker compose up -d
      args:
        chdir: /opt/monitoring

    - name: Restart Prometheus if its config changed
      # Not a `kill -HUP` reload: ansible's template module atomically
      # replaces the file (write-temp + rename), which changes the inode.
      # The container's bind mount stays pinned to the old inode, so a
      # same-process reload silently keeps reading stale config -- only a
      # container restart re-establishes the mount against the new file.
      command: docker restart prometheus
      when: prometheus_config.changed

    - name: Restart Alertmanager if its config changed
      command: docker restart alertmanager
      when: alertmanager_config.changed

    - name: Restart Grafana if its datasource/dashboard config changed
      # Same bind-mount-inode issue as Prometheus/Alertmanager above --
      # datasource provisioning in particular is only read at Grafana's
      # own startup, so a stale mount here means dashboards silently
      # query a Prometheus URL that 404s instead of erroring loudly.
      command: docker restart grafana
      when: static_configs.changed or dashboard_files.changed

    # zammad-relay: turns Alertmanager webhook notifications into Zammad
    # tickets (dedup'd by alert fingerprint, auto-closed on resolve). A
    # native systemd service, not a container -- it's a tiny stdlib-only
    # script and doesn't need Docker's overhead.
    - name: Deploy zammad-relay script
      copy:
        src: files/zammad_relay.py
        dest: /usr/local/bin/zammad_relay.py
        owner: root
        group: root
        mode: "0755"
      register: zammad_relay_script

    - name: Deploy zammad-relay environment file
      template:
        src: templates/zammad-relay.env.j2
        dest: /etc/zammad-relay.env
        owner: root
        group: root
        mode: "0600"
      register: zammad_relay_env

    - name: Deploy zammad-relay systemd unit
      copy:
        dest: /etc/systemd/system/zammad-relay.service
        content: |
          [Unit]
          Description=Alertmanager to Zammad ticket relay
          After=network.target docker.service

          [Service]
          Environment=PYTHONUNBUFFERED=1
          EnvironmentFile=/etc/zammad-relay.env
          ExecStart=/usr/bin/python3 /usr/local/bin/zammad_relay.py
          Restart=on-failure
          User=root

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: zammad_relay_unit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: zammad_relay_unit.changed

    - name: Enable and start zammad-relay
      systemd:
        name: zammad-relay
        enabled: yes
        state: started

    - name: Restart zammad-relay if its script or config changed
      systemd:
        name: zammad-relay
        state: restarted
      when: zammad_relay_script.changed or zammad_relay_env.changed or zammad_relay_unit.changed
