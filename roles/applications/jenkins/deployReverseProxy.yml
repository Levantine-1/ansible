---
- name: Deploy Nginx Reverse Proxy Configuration Files
  hosts: Jenkins
  become: yes

  tasks:
    - name: Install Nginx
      package:
        name: nginx
        state: present

    - name: Remove stock default site
      # Debian's nginx package ships sites-enabled/default as its own
      # default_server on 0.0.0.0:80, which collides with jenkins.conf's
      # own default_server and fails nginx -t on a from-scratch install.
      # Never hit this before because the existing host already had it
      # removed by hand at some point outside of ansible.
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Configure Nginx Reverse Proxies
      template:
        src: "files/jenkins.conf"
        dest: "/etc/nginx/conf.d/jenkins.conf"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ domains }}"

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted