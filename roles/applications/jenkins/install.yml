---
# Fresh-install role for Jenkins, making it genuinely rebuildable rather than
# just having a reverse-proxy config pointed at a black-box VM. Assumes the
# bone-stock Debian 12 baseline from all.yml has already run.
#
# Reproduces: the jenkins system user (customized to a normal login-capable
# admin account, matching how it's actually used), the plugin set, global
# config (security realm + the prod_vault_token credential) via JCasC, and
# the 5 still-relevant Jenkins jobs. Two jobs that existed on the original
# instance (terraform_main, generateSSLCertificate) are deliberately NOT
# reproduced -- both are superseded by service's control-plane setup
# (terraform now has a real S3 backend and runs from service; SSL renewal
# runs from service's systemd timer). See ansible/README.md.
- name: Install and configure Jenkins
  hosts: Jenkins
  become: yes

  vars_files:
    - ../../../vault.yml

  vars:
    # Bumped from the originally-captured 2.452.3: plugins.txt was captured
    # from the live instance's actual installed plugin versions, which
    # require a much newer core (several need >= 2.504.1) than 2.452.3 --
    # the live instance had clearly been upgraded well past that pin at
    # some point without this role being updated to match. 2.504.3 is the
    # latest patch of the LTS line that satisfies every plugin's minimum.
    jenkins_version: "2.504.3"
    automation_ssh_public_key: "ssh-rsa  automation"

  tasks:
    - name: Retrieve Jenkins secrets from HashiCorp Vault
      set_fact:
        jenkins_secrets: "{{ lookup('hashi_vault', 'secret=kv/data/jenkins/admin token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

    - name: Retrieve automation SSH private key from HashiCorp Vault
      set_fact:
        automation_key_secret: "{{ lookup('hashi_vault', 'secret=kv/data/ssh/automation_key token={{ hashicorp_vault_token }} url={{ hashicorp.vault.address }}') }}"

    - name: Set convenience facts
      set_fact:
        jenkins_admin_password: "{{ jenkins_secrets.password }}"
        jenkins_linux_password: "{{ jenkins_secrets.password }}"
        automation_ssh_private_key: "{{ automation_key_secret.private_key }}"
        ansible_vault_password: "{{ jenkins_secrets.ansible_vault_password }}"

    - name: Install Java 17
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: yes

    - name: Download Jenkins apt GPG key
      # pkg.jenkins.io rotates this key every few years via a dated
      # filename, and the old one actually expires (not just gets
      # superseded) -- pinning "-2023" broke silently once that key
      # expired 2026-03-26. There's no dateless "always current" alias:
      # jenkins.io.key (no date) is a separate, even-older key that
      # expired back in 2023. -2026 is the current one (valid until
      # 2028-12-21); this will need bumping again after that.
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /tmp/jenkins.io-2026.key
        mode: "0644"

    - name: Dearmor Jenkins apt GPG key
      # apt's signed-by= needs a binary GPG keyring, not the ASCII-armored
      # .key file pkg.jenkins.io serves -- without this conversion apt
      # can't parse it and every install fails with NO_PUBKEY.
      command: gpg --batch --yes --dearmor -o /usr/share/keyrings/jenkins-keyring.gpg /tmp/jenkins.io-2026.key

    - name: Add Jenkins apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Unhold Jenkins package
      # A re-run that bumps jenkins_version needs to actually change a held
      # package -- apt refuses that non-interactively without this.
      dpkg_selections:
        name: jenkins
        selection: install

    - name: Install Jenkins (pinned version)
      apt:
        name: "jenkins={{ jenkins_version }}"
        state: present
        update_cache: yes
      notify: restart jenkins

    - name: Hold Jenkins package at this version
      dpkg_selections:
        name: jenkins
        selection: hold

    - name: Stop Jenkins before customizing the service account
      service:
        name: jenkins
        state: stopped

    - name: Customize jenkins system user (login-capable admin, matches actual usage)
      user:
        name: jenkins
        home: /home/jenkins
        shell: /bin/bash
        groups: sudo
        append: yes
        move_home: yes
        password: "{{ jenkins_linux_password | password_hash('sha512') }}"

    - name: Create jenkins user .ssh directory
      file:
        path: /home/jenkins/.ssh
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Authorize the automation public key for the jenkins user
      authorized_key:
        user: jenkins
        key: "{{ automation_ssh_public_key }}"

    - name: Deploy automation private key for jenkins user's own onward SSH
      copy:
        content: "{{ automation_ssh_private_key }}"
        dest: /home/jenkins/.ssh/automation.pem
        owner: jenkins
        group: jenkins
        mode: "0600"

    - name: Deploy ansible-vault password file (matches existing job scripts' --vault-password-file ~/vault_pass)
      copy:
        content: "{{ ansible_vault_password }}"
        dest: /home/jenkins/vault_pass
        owner: jenkins
        group: jenkins
        mode: "0664"

    - name: Install jenkins-plugin-manager CLI
      get_url:
        url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.13.2/jenkins-plugin-manager-2.13.2.jar
        dest: /opt/jenkins-plugin-manager.jar
        mode: "0644"

    - name: Copy plugin list
      copy:
        src: files/plugins.txt
        dest: /tmp/plugins.txt
        mode: "0644"

    - name: Install Jenkins plugins
      command: >
        java -jar /opt/jenkins-plugin-manager.jar
        --war /usr/share/java/jenkins.war
        --plugin-file /tmp/plugins.txt
        --plugin-download-directory /var/lib/jenkins/plugins
      notify: restart jenkins

    - name: Set plugin ownership
      file:
        path: /var/lib/jenkins/plugins
        owner: jenkins
        group: jenkins
        recurse: yes

    - name: Create JCasC config directory
      file:
        path: /var/lib/jenkins/casc_configs
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0750"

    - name: Deploy JCasC configuration
      template:
        src: templates/jenkins.yaml.j2
        dest: /var/lib/jenkins/casc_configs/jenkins.yaml
        owner: jenkins
        group: jenkins
        mode: "0640"
      notify: restart jenkins

    - name: Create systemd override directory for jenkins.service
      file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Point Jenkins at the JCasC config via a systemd override
      # The current jenkins.service unit (ExecStart=/usr/bin/jenkins,
      # Type=notify) hardcodes JAVA_OPTS directly in the unit file and
      # does NOT source /etc/default/jenkins's JAVA_ARGS at all -- editing
      # that file (the old approach) silently did nothing, so Jenkins kept
      # falling through to its own first-run setup wizard instead of the
      # JCasC-declared config. A systemd drop-in is the mechanism that
      # actually reaches the JVM on this packaging.
      copy:
        dest: /etc/systemd/system/jenkins.service.d/casc.conf
        content: |
          [Service]
          Environment="CASC_JENKINS_CONFIG=/var/lib/jenkins/casc_configs/jenkins.yaml"
      register: casc_override
      notify: restart jenkins

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: casc_override.changed

    - name: Ensure jobs directories exist
      file:
        path: "/var/lib/jenkins/jobs/{{ item }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"
      loop:
        - DeployContainer
        - deploy_datagateway
        - ManageDockerContainers
        - "Manage Theia Services"
        - Refresh_OS_Baseline

    - name: Deploy job configs
      copy:
        src: "files/jobs/{{ item.file }}"
        dest: "/var/lib/jenkins/jobs/{{ item.name }}/config.xml"
        owner: jenkins
        group: jenkins
        mode: "0644"
      loop:
        - { file: DeployContainer.xml, name: DeployContainer }
        - { file: deploy_datagateway.xml, name: deploy_datagateway }
        - { file: ManageDockerContainers.xml, name: ManageDockerContainers }
        - { file: Manage_Theia_Services.xml, name: "Manage Theia Services" }
        - { file: Refresh_OS_Baseline.xml, name: Refresh_OS_Baseline }
      notify: restart jenkins

    - name: Start and enable Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

  handlers:
    - name: restart jenkins
      service:
        name: jenkins
        state: restarted
